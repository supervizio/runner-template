            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/vm/arch-pacman\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # alpine-runit -- NO init swap, and that is not a shortcut.
  #
  # setup/scripts/detect-init.sh rule 1: "a DEDICATED supervisor (runsvdir,
  # s6-svscan, dinit) takes precedence over the boot init that launched it --
  # on Alpine, runit and s6 ship as OpenRC services, so /run/openrc coexists
  # with a running runsvdir". And expected-matrix.json accepts
  # init_method_regex "supervisor-over-init|pid1" for both of these columns.
