name: Release candidate files
description: >-
  e2e.yml in release mode: pulls the files one leg needs from the private
  candidate named by a validate-release dispatch, proves them against the
  release manifest, extracts the test kit where the agent checkout would have
  been, and lays each asset where the merge-lane download would have put it.

# This is what replaces, in release mode, the two things e2e.yml's legs do with
# a credential in merge mode: `actions/checkout` of the private repository and
# `actions/download-artifact` from the private run. Neither may happen here --
# validate-release.yml calls e2e.yml without a single secret (release-contract
# README D3). What the leg gets instead is exactly what the candidate carries:
#
#   * the published assets it installs, under their RELEASE names, each pulled
#     BY DIGEST and re-hashed against the manifest file pinned by
#     asset_manifest_digest -- the bytes a user downloads, not a CI artifact;
#   * e2e-kit.tar.gz: e2e/, setup/, go.work and .dockerignore
#     of the private tree AT THE TAGGED COMMIT, built by agent's release job and
#     bound by its sha256 in the dispatch like everything else.
#
# The only credential used is the job's own GITHUB_TOKEN (`packages: read`),
# and only in the pull step. Nothing after it holds a token.

inputs:
  dispatch:
    description: The validate-release dispatch body, as JSON ({event_type, client_payload})
    required: true
  files:
    description: >-
      One `<release asset> <destination directory>` pair per line. Each asset is
      pulled, verified against the manifest, and copied to
      <destination>/<release asset>.
    required: true
  kit-dir:
    description: Where the kit is extracted -- the path the merge lane checks the agent tree out to
    required: false
    default: "."
  kit:
    description: >-
      The file holding the kit: a published asset of the release (agent
      releases carry it from the release that made it one, so a published
      release can be revalidated on its own assets), or a support file
      (candidates built before that)
    required: false
    default: e2e-kit.tar.gz
  lane-dir:
    description: Where this repository (runner-template) is checked out
    required: false
    default: .release-lane
  policy:
    description: The contract policy the dispatch is judged under, relative to release-contract/
    required: false
    default: policy.json

runs:
  using: composite
  steps:
    - name: Pull, verify and place the candidate files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DISPATCH: ${{ inputs.dispatch }}
        FILES: ${{ inputs.files }}
        KIT_DIR: ${{ inputs.kit-dir }}
        KIT: ${{ inputs.kit }}
        LANE_DIR: ${{ inputs.lane-dir }}
        POLICY: ${{ inputs.policy }}
      run: |
        set -euo pipefail
        PY="$(command -v python3 || command -v python)"
        # The two policies validate-release.yml may judge an agent candidate
        # under; anything else is refused before a byte is pulled.
        case "$POLICY" in
          policy.json|tests/e2e-proof-policy.json) ;;
          *) echo "::error::refusing policy '$POLICY'"; exit 1 ;;
        esac
        RC=("$PY" "$LANE_DIR/release-contract/release_contract.py" --policy "$LANE_DIR/release-contract/$POLICY")
        # Relative to the workspace, not $RUNNER_TEMP: on the Windows legs Git
        # Bash's tar reads a `D:\...` path as a remote host, and native Python
        # cannot read the /d/... form bash would give instead. Removed once the
        # files are placed, so no VM leg syncs it into a guest.
        work=.release-candidate
        rm -rf "$work"
        mkdir -p "$work/files"
        printf '%s' "$DISPATCH" > "$work/dispatch.json"
        "${RC[@]}" dispatch check "$work/dispatch.json"

        # manifest_file and asset_manifest_digest, and where the kit is: a
        # published asset (`manifest`, re-hashed against the manifest file
        # below like any asset) or a support file (bound by the dispatch).
        # tr -d '\r': Python on Windows ends lines with CRLF.
        "$PY" -c 'import json, sys
        payload = json.load(open(sys.argv[1]))["client_payload"]
        c = payload["candidate"]
        kit = sys.argv[2]
        where = "manifest" if kit in payload["manifest"] else "support" if kit in payload["support"] else "none"
        print(c["manifest_file"], c["asset_manifest_digest"], where)' \
          "$work/dispatch.json" "$KIT" | tr -d '\r' > "$work/candidate.txt"
        read -r manifest_file digest kit_where < "$work/candidate.txt"
        [ "$kit_where" != none ] || { echo "::error::the candidate carries no $KIT, as an asset or a support file: nothing to run the scenario with"; exit 1; }

        assets=()
        dests=()
        while read -r asset dest rest; do
          [ -n "${asset:-}" ] || continue
          [ -n "${dest:-}" ] && [ -z "${rest:-}" ] || { echo "::error::files: expected '<asset> <dir>', got '$asset $dest $rest'"; exit 1; }
          assets+=("$asset")
          dests+=("$dest")
        done <<< "$FILES"
        [ "${#assets[@]}" -gt 0 ] || { echo "::error::files names no asset"; exit 1; }

        only=(--only "$manifest_file" --only "$KIT")
        verify=()
        [ "$kit_where" = manifest ] && verify+=(--only "$KIT")
        for a in "${assets[@]}"; do only+=(--only "$a"); verify+=(--only "$a"); done
        # bridge pull re-admits the artifact against the dispatch and refuses any
        # blob that does not hash to its layer digest; verify-files then checks
        # the assets against the manifest FILE, pinned by asset_manifest_digest.
        "${RC[@]}" bridge pull --dispatch "$work/dispatch.json" --dir "$work/files" "${only[@]}"
        "${RC[@]}" manifest verify-files --manifest "$work/files/$manifest_file" \
          --expect-digest "$digest" --dir "$work/files" "${verify[@]}"

        mkdir -p "$KIT_DIR"
        tar -xzf "$work/files/$KIT" -C "$KIT_DIR"
        for i in "${!assets[@]}"; do
          mkdir -p "${dests[$i]}"
          cp "$work/files/${assets[$i]}" "${dests[$i]}/${assets[$i]}"
          echo "placed ${assets[$i]} in ${dests[$i]}/"
        done
        rm -rf "$work"
        echo "kit extracted into $KIT_DIR:"
        ls -a "$KIT_DIR" | head -20
