  # ===========================================================================
  # VM CLEANUP: reset the VMs this run acquired
  # ===========================================================================

  # Ne reinitialise QUE les VM prises par CE run — jamais la bande entiere.
  #
  # Avant : ce job listait les VMID 200-215 via l'API et appelait `ci-vm-down`
  # sur chacune, en `if: always()`, sans aucune connaissance des autres
  # pipelines. supervizio/agent acquiert les MEMES VM pour ses jobs natifs (via
  # `ci-vm-up`, sous bail transactionnel cote banc) : le balayage les ramenait au
  # snapshot en plein milieu de leurs tests, et ~/build disparaissait sous le job
  # d'en face. Trace sur agent run 34877484899 — "P3 NetBSD (native)" tenait la
  # VM 211 depuis 18:31:21 ; le `vm-cleanup` du run 34880124602 de CE depot l'a
  # reinitialisee ; le scp suivant a rendu `dest open "build/..." : No such file
  # or directory`. Meme signature pour les echecs "aleatoires" OpenBSD/NetBSD et
  # pour la VM Windows qui "se tait".
  #
  # Le flock par VM ne protegeait pas de ca : il ne couvre que la duree du
  # `ci-vm-down` lui-meme, pas celle du job qui detient la VM. Et `ci-vm-down` ne
  # consulte aucun bail — c'est le chemin de LIBERATION, il efface le bail qu'il
  # trouve, y compris celui d'un autre depot.
  #
  # Desormais chaque leg publie la VM qu'il a reellement acquise (artefact
  # `vm-claim-<name>`, ecrit par l'etape "Record VM claim") et ce job ne touche
  # que cette liste. Une VM que ce run n'a jamais prise n'est jamais reinitialisee.
  vm-cleanup:
    name: VM Cleanup
    # e2e-macos (215 sequoia) et e2e-windows (214) tenaient aussi des VM de la
    # bande, d'ou leur presence ici : sans les attendre, leur claim n'existait
    # pas encore au telechargement. Les deux tournent desormais sur des runners
    # GitHub et ne prennent plus rien, donc seul e2e-vm reste a attendre.
    # Ce job disparait entierement le jour ou e2e-vm quitte le banc a son tour.
    needs: [e2e-vm]
    if: always() && github.event.inputs.arm_only != 'true'
    runs-on: supervizio-runner
    timeout-minutes: 10
    env:
      # Plus de PVE_AUTH/NODE/PROXMOX_API_URL : ce job ne DECOUVRE plus de VM, il
      # lit la liste de celles qu'il a prises. L'action `bench-api-tunnel` et le
      # token PVE n'ont donc plus lieu d'etre ici — moins de surface, et plus
      # aucun chemin capable de designer une VM tierce.
      SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # continue-on-error : un run ou aucun leg n'a acquis de VM (skip, annulation
      # avant l'acquisition) ne publie aucun claim, et download-artifact echoue
      # quand le motif ne correspond a rien. L'etape suivante traite l'absence de
      # repertoire comme "rien a reinitialiser".
      - name: Download VM claims
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: vm-claim-*
          path: vm-claims
          merge-multiple: true

      - name: Reset claimed VMs to their restore point
        run: |
          echo "=== VM Cleanup: resetting the VMs acquired by this run ==="

          if [ ! -d vm-claims ]; then
            echo "No claim artifact: this run acquired no VM. Nothing to reset."
            exit 0
          fi

          # Une ligne = un VMID. `sort -u` parce qu'aucun leg ne partage une VM,
          # mais un re-run partiel peut republier un claim deja present.
          VMIDS=$(cat vm-claims/*.txt 2>/dev/null | tr -d '\r' | grep -E '^[0-9]+$' | sort -nu)

          if [ -z "$VMIDS" ]; then
            echo "Claim artifacts present but empty. Nothing to reset."
            exit 0
          fi

          echo "Claimed by this run: $(echo "$VMIDS" | tr '\n' ' ')"

          TOTAL=0
          FAILED=0
          for VMID in $VMIDS; do
            # Defense en profondeur : `ci-vm-updown.sh` garde deja la bande
            # 200-215 cote hote, mais un claim corrompu ne doit meme pas partir.
            if [ "$VMID" -lt 200 ] || [ "$VMID" -gt 215 ]; then
              echo "  SKIP ${VMID}: hors bande test 200-215"
              continue
            fi

            TOTAL=$((TOTAL + 1))
            echo ""
            echo "--- VMID ${VMID} ---"

            # `ci-vm-down` fait stop + rollback (dev, repli base) + enforce +
            # start cote hote, en root, SOUS LE FLOCK PAR VM (kodflow/labs#159),
            # et efface le bail. Aucun privilege PVE requis : le token est
            # privsep=1 et l'ACL de ci-runner@pve, reduite a CIRunner (labs#195),
            # n'a PAS VM.Snapshot.Rollback — l'appel API rendait 403.
            if ssh ${SSH_OPTS} -i ~/.ssh/id_ed25519 root@192.168.100.1 \
                 "ci-vm-down ${VMID}" >/dev/null 2>&1; then
              echo "  OK: ${VMID} reset to its restore point"
            else
              echo "  WARNING: failed to reset ${VMID}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== VM Cleanup Complete ==="
          echo "  VMs claimed by this run: ${TOTAL}"
          echo "  Failed: ${FAILED}"

          if [ "$FAILED" -gt 0 ]; then
            echo "  WARNING: ${FAILED} VM(s) failed to reset (non-fatal)"
          fi

  # ===========================================================================
  # REPORT: Aggregate results and post final commit status
  # ===========================================================================

  report:
    name: Report Results
    # e2e-windows belongs here. Without it the aggregate reports green while
    # the Windows leg is red: it is not in needs, so its result is never read
    # and the job does not even wait for it.
    needs: [resolve, e2e-docker-amd64, e2e-docker-arm64, e2e-macos, e2e-macos-arm64, e2e-vm, e2e-windows-amd64, e2e-windows-arm64,
             e2e-bsd-freebsd-amd64, e2e-bsd-netbsd-amd64, e2e-bsd-openbsd-amd64,
             e2e-bsd-freebsd-arm64, e2e-bsd-netbsd-arm64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate results
        run: |
          echo "=== E2E Results ==="
          echo "e2e-docker-amd64: ${{ needs.e2e-docker-amd64.result }}"
          echo "e2e-docker-arm64: ${{ needs.e2e-docker-arm64.result }}"
          echo "e2e-macos:        ${{ needs.e2e-macos.result }}"
          echo "e2e-macos-arm64:  ${{ needs.e2e-macos-arm64.result }}"
          echo "e2e-vm:           ${{ needs.e2e-vm.result }}"
          echo "e2e-windows-amd64:${{ needs.e2e-windows-amd64.result }}"
          echo "e2e-windows-arm64:${{ needs.e2e-windows-arm64.result }}"
          echo "e2e-bsd-freebsd-amd64: ${{ needs.e2e-bsd-freebsd-amd64.result }}"
          echo "e2e-bsd-freebsd-arm64: ${{ needs.e2e-bsd-freebsd-arm64.result }}"
          echo "e2e-bsd-netbsd-amd64:  ${{ needs.e2e-bsd-netbsd-amd64.result }}"
          echo "e2e-bsd-netbsd-arm64:  ${{ needs.e2e-bsd-netbsd-arm64.result }}"
          echo "e2e-bsd-openbsd:  ${{ needs.e2e-bsd-openbsd-amd64.result }}"

      - name: Report final status
        # !cancelled() matters now that `cancelled` counts as a failure below:
        # `if: always()` on this job makes it run even when the whole run was
        # cancelled by cancel-in-progress, and it would then post a red verdict
        # for a SHA whose superseding run goes green half an hour later.
        if: ${{ !cancelled() && needs.resolve.outputs.sha != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          RESULTS=("${{ needs.e2e-docker-amd64.result }}" "${{ needs.e2e-docker-arm64.result }}" \
                   "${{ needs.e2e-macos.result }}" "${{ needs.e2e-macos-arm64.result }}" \
                   "${{ needs.e2e-vm.result }}" "${{ needs.e2e-windows-amd64.result }}" "${{ needs.e2e-windows-arm64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-amd64.result }}" "${{ needs.e2e-bsd-netbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-openbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-arm64.result }}" "${{ needs.e2e-bsd-netbsd-arm64.result }}")
          STATE="success"
          DESC="All E2E tests passed"
          for r in "${RESULTS[@]}"; do
            # cancelled counts as failed, exactly as agent's own CI Summary
            # treats it: a leg cancelled mid-flight proved nothing, and must not
            # read as green on the verdict reported back.
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              STATE="failure"
              DESC="E2E tests failed"
              break
            fi
          done
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/supervizio/agent/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/runner-template\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Dispatch callback to agent repo
        # Same reason as the status above: a cancelled run must not tell agent
        # its E2E failed.
        if: ${{ !cancelled() && needs.resolve.outputs.sha != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          RESULTS=("${{ needs.e2e-docker-amd64.result }}" "${{ needs.e2e-docker-arm64.result }}" \
                   "${{ needs.e2e-macos.result }}" "${{ needs.e2e-macos-arm64.result }}" \
                   "${{ needs.e2e-vm.result }}" "${{ needs.e2e-windows-amd64.result }}" "${{ needs.e2e-windows-arm64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-amd64.result }}" "${{ needs.e2e-bsd-netbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-openbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-arm64.result }}" "${{ needs.e2e-bsd-netbsd-arm64.result }}")
          STATE="success"
          for r in "${RESULTS[@]}"; do
            # cancelled counts as failed, exactly as agent's own CI Summary
            # treats it: a leg cancelled mid-flight proved nothing, and must not
            # read as green on the verdict reported back.
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              STATE="failure"
              break
            fi
          done
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/supervizio/agent/dispatches" \
            -d "{\"event_type\":\"e2e-result\",\"client_payload\":{\"state\":\"$STATE\",\"sha\":\"${{ needs.resolve.outputs.sha }}\",\"run_id\":\"${{ github.run_id }}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
          echo "Dispatched e2e-result to supervizio/agent (state=$STATE)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## E2E Test Results (runner-template)"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Docker amd64 | \`${{ needs.e2e-docker-amd64.result }}\` |"
            echo "| Docker arm64 | \`${{ needs.e2e-docker-arm64.result }}\` |"
            echo "| macOS x86_64 | \`${{ needs.e2e-macos.result }}\` |"
            echo "| macOS ARM64 | \`${{ needs.e2e-macos-arm64.result }}\` |"
            echo "| VM E2E | \`${{ needs.e2e-vm.result }}\` |"
            echo "| Windows amd64 | \`${{ needs.e2e-windows-amd64.result }}\` |"
            echo "| Windows arm64 | \`${{ needs.e2e-windows-arm64.result }}\` |"
            echo "| BSD freebsd amd64 | \`${{ needs.e2e-bsd-freebsd-amd64.result }}\` |"
            echo "| BSD freebsd arm64 | \`${{ needs.e2e-bsd-freebsd-arm64.result }}\` |"
            echo "| BSD netbsd amd64 | \`${{ needs.e2e-bsd-netbsd-amd64.result }}\` |"
            echo "| BSD netbsd arm64 | \`${{ needs.e2e-bsd-netbsd-arm64.result }}\` |"
            echo "| BSD openbsd amd64 | \`${{ needs.e2e-bsd-openbsd-amd64.result }}\` |"
            echo ""
            echo "**Agent ref:** \`${{ needs.resolve.outputs.ref }}\`"
            echo "**Agent SHA:** \`${{ needs.resolve.outputs.sha }}\`"
            echo "**Agent run:** \`${{ needs.resolve.outputs.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any E2E failed
        run: |
          RESULTS=("${{ needs.e2e-docker-amd64.result }}" "${{ needs.e2e-docker-arm64.result }}" \
                   "${{ needs.e2e-macos.result }}" "${{ needs.e2e-macos-arm64.result }}" \
                   "${{ needs.e2e-vm.result }}" "${{ needs.e2e-windows-amd64.result }}" "${{ needs.e2e-windows-arm64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-amd64.result }}" "${{ needs.e2e-bsd-netbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-openbsd-amd64.result }}" \
                   "${{ needs.e2e-bsd-freebsd-arm64.result }}" "${{ needs.e2e-bsd-netbsd-arm64.result }}")
          for r in "${RESULTS[@]}"; do
            # cancelled counts as failed, exactly as agent's own CI Summary
            # treats it: a leg cancelled mid-flight proved nothing, and must not
            # read as green on the verdict reported back.
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "FAILED: At least one E2E job failed"
              exit 1
            fi
          done
          echo "SUCCESS: All E2E tests passed"
