          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/vm/arch-pacman\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # alpine-runit -- NO init swap, and that is not a shortcut.
  #
  # setup/scripts/detect-init.sh rule 1: "a DEDICATED supervisor (runsvdir,
  # s6-svscan, dinit) takes precedence over the boot init that launched it --
  # on Alpine, runit and s6 ship as OpenRC services, so /run/openrc coexists
  # with a running runsvdir". And expected-matrix.json accepts
  # init_method_regex "supervisor-over-init|pid1" for both of these columns.
  #
  # So the bench VM is not Alpine-with-runsvdir-as-PID-1; it is stock Alpine with
  # runsvdir RUNNING. Starting the supervisor reproduces that exactly, with no
  # reboot, no bootloader edit and no cache-after-prepare. The scandir matches
  # the one expected-matrix.json pins for this column (/etc/service).
  e2e-linux-alpine-runit:
    name: E2E Linux alpine-runit
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/alpine-runit","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.apk
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
      - name: Resolve and normalise the package
        run: |
          set -euo pipefail
          ls -la pkg/
          found=$(find pkg -type f -name "*.apk" | head -1)
          [ -n "$found" ] && [ -s "$found" ] || {
            echo "::error::no *.apk in the downloaded artifact — did agent publish it? (public E2E bridge)" >&2
            exit 1
          }
          [ "$found" = "pkg/supervizio-amd64.apk" ] || mv "$found" "pkg/supervizio-amd64.apk"
          ls -l "pkg/supervizio-amd64.apk"

      - name: Install, graft onto runsvdir, validate and uninstall
        uses: vmactions/alpine-vm@697847385681cdc413604693010eded91e8d9650 # v1.0.1
        with:
          release: '3.23'
          copyback: false
          cache-after-prepare: true
          prepare: |
            apk add --no-cache jq runit
            # PSI is compiled in but default-disabled on this kernel, so the
            # pressure collectors read null and validate-probe.sh fails three
            # required numerics. Debian ships it enabled, which is why that leg
            # was the only one to pass. extlinux is Alpine's bootloader.
            for f in /boot/extlinux.conf /extlinux.conf; do
              [ -f "$f" ] && sed -i '/APPEND/ s/$/ psi=1/' "$f"
            done
            grep -h APPEND /boot/extlinux.conf 2>/dev/null || true
          run: |
            set -e
            WS="$(pwd)"
            echo "=== Platform ==="; uname -srm; head -2 /etc/os-release
            echo "PID1=$(cat /proc/1/comm)   (busybox init -- the supervisor runs ON TOP of it)"

            echo "=== Start runsvdir ==="
            mkdir -p /etc/service
            (setsid /usr/bin/runsvdir -P /etc/service >/dev/null 2>&1 &) ; sleep 2
            # Scan /proc/*/comm, NOT `pgrep -x`. setup/scripts/detect-init.sh
            # says it outright: "busybox `pgrep -x` has been observed to MISS a
            # live supervisor (e.g. runsvdir on Alpine) that a /proc/comm scan
            # finds" -- which is why the agent's own detector scans /proc. Using
            # pgrep here reported "did not start" for a supervisor that was
            # running, i.e. the check was blind, not the supervisor absent.
            svz_running() {
              for c in /proc/[0-9]*/comm; do
                [ -r "$c" ] || continue
                IFS= read -r n < "$c" 2>/dev/null || continue
                [ "$n" = "runsvdir" ] && return 0
              done
              return 1
            }
            i=0; while [ $i -lt 30 ]; do
              svz_running && break
              i=$((i+1)); sleep 1
            done
            svz_running || { echo "::error::runsvdir did not start"; ps aux 2>/dev/null | head -20; exit 1; }
            echo "OK: runsvdir is running (scandir /etc/service)"

            echo "=== Install ==="
            export SUPERVIZIO_LOCAL_PKG="$WS/pkg/supervizio-amd64.apk"
            sh "$WS/setup/install.sh" || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "::error::binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            # The assertion this leg exists for: the SAME .apk must graft onto
            # whichever supervisor is live, not onto OpenRC just because Alpine
            # booted with it.
            echo "=== Verify the service grafted onto runit, not OpenRC ==="
            [ -e /etc/service/supervizio ] || { echo "::error::no runit service in /etc/service"; ls -la /etc/service || true; exit 1; }
            echo "OK: runit scandir has supervizio"

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh" /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            echo "=== Uninstall ==="
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh "$WS/setup/uninstall.sh"
            [ -x /usr/local/bin/supervizio ] && echo "::warning::binary still present after uninstall" || true

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/vm/alpine-runit\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # alpine-s6 -- NO init swap, and that is not a shortcut.
  #
  # setup/scripts/detect-init.sh rule 1: "a DEDICATED supervisor (runsvdir,
  # s6-svscan, dinit) takes precedence over the boot init that launched it --
  # on Alpine, runit and s6 ship as OpenRC services, so /run/openrc coexists
  # with a running runsvdir". And expected-matrix.json accepts
  # init_method_regex "supervisor-over-init|pid1" for both of these columns.
  #
  # So the bench VM is not Alpine-with-s6-svscan-as-PID-1; it is stock Alpine with
  # s6-svscan RUNNING. Starting the supervisor reproduces that exactly, with no
  # reboot, no bootloader edit and no cache-after-prepare. The scandir matches
  # the one expected-matrix.json pins for this column (/run/service).
  e2e-linux-alpine-s6:
    name: E2E Linux alpine-s6
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/alpine-s6","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.apk
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
      - name: Resolve and normalise the package
        run: |
          set -euo pipefail
          ls -la pkg/
          found=$(find pkg -type f -name "*.apk" | head -1)
          [ -n "$found" ] && [ -s "$found" ] || {
            echo "::error::no *.apk in the downloaded artifact — did agent publish it? (public E2E bridge)" >&2
            exit 1
          }
          [ "$found" = "pkg/supervizio-amd64.apk" ] || mv "$found" "pkg/supervizio-amd64.apk"
          ls -l "pkg/supervizio-amd64.apk"

      - name: Install, graft onto s6-svscan, validate and uninstall
        uses: vmactions/alpine-vm@697847385681cdc413604693010eded91e8d9650 # v1.0.1
        with:
          release: '3.23'
          copyback: false
          cache-after-prepare: true
          prepare: |
            apk add --no-cache jq s6
            # PSI is compiled in but default-disabled on this kernel, so the
            # pressure collectors read null and validate-probe.sh fails three
            # required numerics. Debian ships it enabled, which is why that leg
            # was the only one to pass. extlinux is Alpine's bootloader.
            for f in /boot/extlinux.conf /extlinux.conf; do
              [ -f "$f" ] && sed -i '/APPEND/ s/$/ psi=1/' "$f"
            done
            grep -h APPEND /boot/extlinux.conf 2>/dev/null || true
          run: |
            set -e
            WS="$(pwd)"
            echo "=== Platform ==="; uname -srm; head -2 /etc/os-release
            echo "PID1=$(cat /proc/1/comm)   (busybox init -- the supervisor runs ON TOP of it)"

            echo "=== Start s6-svscan ==="
            mkdir -p /run/service
            (setsid /usr/bin/s6-svscan /run/service >/dev/null 2>&1 &) ; sleep 2
            # Scan /proc/*/comm, NOT `pgrep -x`. setup/scripts/detect-init.sh
            # says it outright: "busybox `pgrep -x` has been observed to MISS a
            # live supervisor (e.g. runsvdir on Alpine) that a /proc/comm scan
            # finds" -- which is why the agent's own detector scans /proc. Using
            # pgrep here reported "did not start" for a supervisor that was
            # running, i.e. the check was blind, not the supervisor absent.
            svz_running() {
              for c in /proc/[0-9]*/comm; do
                [ -r "$c" ] || continue
                IFS= read -r n < "$c" 2>/dev/null || continue
                [ "$n" = "s6-svscan" ] && return 0
              done
              return 1
            }
            i=0; while [ $i -lt 30 ]; do
              svz_running && break
              i=$((i+1)); sleep 1
            done
            svz_running || { echo "::error::s6-svscan did not start"; ps aux 2>/dev/null | head -20; exit 1; }
            echo "OK: s6-svscan is running (scandir /run/service)"

            echo "=== Install ==="
            export SUPERVIZIO_LOCAL_PKG="$WS/pkg/supervizio-amd64.apk"
            sh "$WS/setup/install.sh" || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "::error::binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            # The assertion this leg exists for: the SAME .apk must graft onto
            # whichever supervisor is live, not onto OpenRC just because Alpine
            # booted with it.
            echo "=== Verify the service grafted onto s6, not OpenRC ==="
            [ -e /run/service/supervizio ] || { echo "::error::no s6 service in /run/service"; ls -la /run/service || true; exit 1; }
            echo "OK: s6 scandir has supervizio"

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh" /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            echo "=== Uninstall ==="
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh "$WS/setup/uninstall.sh"
            [ -x /usr/local/bin/supervizio ] && echo "::warning::binary still present after uninstall" || true

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/vm/alpine-s6\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

