  # runsvdir RUNNING. Starting the supervisor reproduces that exactly, with no
  # reboot, no bootloader edit and no cache-after-prepare. The scandir matches
  # the one expected-matrix.json pins for this column (/etc/service).
  e2e-linux-alpine-runit:
    name: E2E Linux alpine-runit
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/alpine-runit","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.apk
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
