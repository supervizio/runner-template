  # openSUSE has NO vmactions image, so it goes through the in-repo qemu-vm
  # action instead. That action is now proven: run 35400826120, 8/8 green on
  # ubuntu-24.04 and ubuntu-26.04, including this exact image and checksum,
  # booting to SSH in 38.3s.
  #
  # The one structural difference from a vmactions leg: vmactions rsyncs the
  # whole workspace into the guest, qemu-vm copies only what `files` names. The
  # four scripts below are self-contained (install.sh and uninstall.sh embed the
  # detect-init contract textually), so naming them is enough and keeps what
  # crosses into a root shell explicit.
  e2e-linux-opensuse-zypper:
    name: E2E Linux opensuse-zypper
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/opensuse-zypper","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout runner-template (for the qemu-vm action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.rpm
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
      - name: Resolve and normalise the package
        run: |
          set -euo pipefail
          ls -la pkg/
          found=$(find pkg -type f -name "*.rpm" | head -1)
          [ -n "$found" ] && [ -s "$found" ] || {
            echo "::error::no *.rpm in the downloaded artifact — did agent publish it? (public E2E bridge)" >&2
            exit 1
          }
          [ "$found" = "pkg/supervizio-amd64.rpm" ] || mv "$found" "pkg/supervizio-amd64.rpm"
          ls -l "pkg/supervizio-amd64.rpm"

      - name: Install, graft, validate and uninstall in an openSUSE guest
        uses: ./.github/actions/qemu-vm
        env:
          PKG: /root/supervizio-amd64.rpm
        with:
          image-url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
          image-sha256: c5cd6904632c86d5368dea3896da8c17571c238ef96a0e2c8b0ca1835d796e07
          memory: "2048"
          timeout: "1500"
          # openSUSE's kernel compiles PSI in but leaves it off, so the pressure
          # collectors read null and validate-probe.sh fails three required
          # numerics. Arch does not need this -- it ships PSI enabled, which is
          # why arch-pacman went green on the same run openSUSE did not.
          kernel-args: psi=1
          # ssh carries no environment; naming it here is what gets it across.
          envs: PKG
          files: |
            pkg/supervizio-amd64.rpm:/root/supervizio-amd64.rpm
            agent/setup/install.sh:/root/install.sh
            agent/setup/uninstall.sh:/root/uninstall.sh
            agent/e2e/validate-probe.sh:/root/validate-probe.sh
            agent/e2e/scenario-battery.sh:/root/scenario-battery.sh
          run: |
            echo "=== Platform ==="; uname -srm; head -2 /etc/os-release
            echo "PID1=$(cat /proc/1/comm)"
            # The reason this leg exists: zypper is a distinct branch in
            # install.sh (rpm-zypper) and in the Go detector, and no other leg
            # reaches it. Assert it is really the manager in play.
            # validate-probe.sh makes 39 jq calls and the qemu-vm action has no
            # `prepare:` input, so nothing had installed it: --probe ran fine and the
            # validator reported "Invalid JSON output" for a missing parser.
            zypper -n --gpg-auto-import-keys install jq >/dev/null 2>&1 || zypper -n install jq \
              || { echo "::error::could not install jq"; exit 1; }
            command -v jq >/dev/null || { echo "::error::jq still absent"; exit 1; }

            command -v zypper >/dev/null || { echo "::error::zypper absent — this is not an openSUSE guest"; exit 1; }

            echo "=== Install ==="
            export SUPERVIZIO_LOCAL_PKG="$PKG"
            sh /root/install.sh || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "::error::binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            echo "=== Verify the service grafted onto systemd ==="
            systemctl is-enabled supervizio >/dev/null 2>&1 || {
              echo "::error::not enabled under systemd"; systemctl status supervizio || true; exit 1; }
            echo "OK: systemd has supervizio enabled"

            echo "=== Validate probe ==="
            sh /root/validate-probe.sh /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh /root/scenario-battery.sh /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            echo "=== Uninstall ==="
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh /root/uninstall.sh
            [ -x /usr/local/bin/supervizio ] && echo "::warning::binary still present after uninstall" || true

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/vm/opensuse-zypper\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # pacman is the one package manager with no other route. No vmactions image
  # exists for the Arch family, and nothing else in this matrix reaches
  # pacman_linux.go (the discovery adapter that walks /var/lib/pacman/local) or
  # install.sh's `pacman` branch. So this leg goes through qemu-vm, proven by
  # run 35400826120.
  #
  # Arch, not Artix, and that is a deliberate narrowing: Artix would also give
  # dinit, but it ships no cloud image. Arch gives pacman under systemd. This
  # leg therefore replaces the PACKAGE-MANAGER half of the bench's artix-dinit
  # leg and not its init half — dinit stays on the bench until it has a working
  # boot configuration, which run 35398438742 showed is a real piece of work.
  #
  # A VERSIONED path, never images/latest/: latest/ rolls on each build and
  # would silently invalidate the checksum below.
  e2e-linux-arch-pacman:
    name: E2E Linux arch-pacman
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/arch-pacman","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout runner-template (for the qemu-vm action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.pkg.tar.zst
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
      - name: Resolve and normalise the package
        run: |
          set -euo pipefail
          ls -la pkg/
          found=$(find pkg -type f -name "*.pkg.tar.zst" | head -1)
          [ -n "$found" ] && [ -s "$found" ] || {
            echo "::error::no *.pkg.tar.zst in the downloaded artifact — did agent publish it? (public E2E bridge)" >&2
            exit 1
          }
          [ "$found" = "pkg/supervizio-amd64.pkg.tar.zst" ] || mv "$found" "pkg/supervizio-amd64.pkg.tar.zst"
          ls -l "pkg/supervizio-amd64.pkg.tar.zst"

      - name: Install, graft, validate and uninstall in an Arch guest
        uses: ./.github/actions/qemu-vm
        env:
          PKG: /root/supervizio-amd64.pkg.tar.zst
        with:
          image-url: https://geo.mirror.pkgbuild.com/images/v20260915.594445/Arch-Linux-x86_64-cloudimg-20260915.594445.qcow2
          image-sha256: d7cc7c86a21b32d6678c001464714f71f4ef7e0d7bbbfca65e99123ac5afc25b
          memory: "2048"
          timeout: "1500"
          envs: PKG
          files: |
            pkg/supervizio-amd64.pkg.tar.zst:/root/supervizio-amd64.pkg.tar.zst
            agent/setup/install.sh:/root/install.sh
            agent/setup/uninstall.sh:/root/uninstall.sh
            agent/e2e/validate-probe.sh:/root/validate-probe.sh
            agent/e2e/scenario-battery.sh:/root/scenario-battery.sh
          run: |
            echo "=== Platform ==="; uname -srm; head -2 /etc/os-release
            echo "PID1=$(cat /proc/1/comm)"
            # The reason this leg exists. install.sh picks its branch by
            # `command -v`, so assert pacman is genuinely the manager in play
            # rather than trusting the image label.
            # validate-probe.sh makes 39 jq calls and the qemu-vm action has no
            # `prepare:` input, so nothing had installed it: --probe ran fine and the
            # validator reported "Invalid JSON output" for a missing parser.
            pacman -Sy --noconfirm --needed jq >/dev/null 2>&1 \
              || { echo "::error::could not install jq"; exit 1; }
            command -v jq >/dev/null || { echo "::error::jq still absent"; exit 1; }

            command -v pacman >/dev/null || { echo "::error::pacman absent — this is not an Arch-family guest"; exit 1; }
            echo "pacman db entries before: $(ls -1 /var/lib/pacman/local 2>/dev/null | wc -l)"

            echo "=== Install ==="
            export SUPERVIZIO_LOCAL_PKG="$PKG"
            sh /root/install.sh || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "::error::binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            # Proves the pacman DISCOVERY adapter has something real to read:
            # pacman_linux.go walks /var/lib/pacman/local looking for a `desc`
            # per package, and this is the only leg where that path is populated
            # by an actual supervizio install.
            echo "=== Verify pacman's local db recorded the package ==="
            pacman -Q supervizio || { echo "::error::pacman does not know the package it just installed"; exit 1; }
            ls -d /var/lib/pacman/local/supervizio-* >/dev/null || {
