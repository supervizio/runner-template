name: cleanup-product-runs

# =============================================================================
# The net under every other cleanup: deletes each COMPLETED run of the
# workflows that handle agent's or libprobe's bytes once it has been completed
# for 30 minutes, whatever triggered it (repository_dispatch,
# workflow_dispatch, a re-run), and fails if a delete is refused.
#
# Why a sweeper and not a last job in each workflow: GitHub refuses to delete a
# run that is still in progress, so a run can never delete itself. The first
# line of cleanup is elsewhere and fast:
#   * e2e.yml, external-e2e.yml: cleanup-external-e2e.yml, on workflow_run
#     completion (repository_dispatch runs);
#   * agent-packages.yml, libprobe-solarish.yml: the private caller, right
#     after it has downloaded what it needs; sweep.yml after two hours.
# This workflow catches what those miss: a workflow_dispatch run, a janitor
# that failed, a caller that died before its cleanup.
#
# 30 minutes after completion is longer than any caller takes to download a
# finished run's artifacts (each polls the run and downloads on completion).
#
# NOT here: validate-release.yml. Its runs are the evidence a promotion reads
# (release-contract/README.md, D3), carry no private source, and the
# repository's retention setting removes them.
#
# Credential: this repository's GITHUB_TOKEN, actions: write on this
# repository only. Nothing is checked out, nothing else is read.
# =============================================================================

on:
  schedule:
    # Every 15 minutes, off sweep.yml's :17 so the two never list the same runs
    # at the same moment.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup-product-runs
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete completed product runs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete completed runs older than 30 minutes
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          WORKFLOWS: e2e.yml external-e2e.yml agent-packages.yml libprobe-solarish.yml
          MIN_AGE_MINUTES: "30"
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-${MIN_AGE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)"
          echo "deleting completed runs last updated before ${cutoff}"

          # -f: an HTTP error fails the listing instead of reading as "none".
          list() { # workflow -> ids of completed runs updated before the cutoff
            local page=1 body ids
            while :; do
              body="$(curl -fsS -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/actions/workflows/$1/runs?status=completed&per_page=100&page=$page")"
              ids="$(jq -r --arg c "$cutoff" '.workflow_runs[] | select(.updated_at < $c) | .id' <<<"$body")"
              [ -z "$ids" ] || printf '%s\n' "$ids"
              [ "$(jq '.workflow_runs | length' <<<"$body")" -eq 100 ] || break
              page=$((page + 1))
            done
          }

          failed=0
          for wf in $WORKFLOWS; do
            # Collected in full before anything is deleted: deleting while
            # paging shifts the pages and skips runs.
            ids="$(list "$wf")"
            n=0
            for rid in $ids; do
              code="$(curl -sS -o "$RUNNER_TEMP/delete.txt" -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" "$API/actions/runs/$rid")" || code="curl-error"
              case "$code" in
                204) n=$((n + 1)) ;;
                404) echo "run $rid of $wf was already gone" ;;
                *) echo "::error::could not delete run $rid of $wf (HTTP $code)"; cat "$RUNNER_TEMP/delete.txt" || true; failed=1 ;;
              esac
            done
            echo "$wf: deleted $n run(s)"
          done

          # The last word is the listing's, not this job's bookkeeping.
          for wf in $WORKFLOWS; do
            left="$(list "$wf")"
            if [ -n "$left" ]; then
              echo "::error::$wf still has completed run(s) older than ${MIN_AGE_MINUTES} min: $(paste -sd' ' <<<"$left")"
              failed=1
            fi
          done
          [ "$failed" = 0 ]
