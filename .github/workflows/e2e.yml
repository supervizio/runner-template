  # ===========================================================================
  # VM CLEANUP: reset the VMs this run acquired
  # ===========================================================================

  # Ne reinitialise QUE les VM prises par CE run — jamais la bande entiere.
  #
  # Avant : ce job listait les VMID 200-215 via l'API et appelait `ci-vm-down`
  # sur chacune, en `if: always()`, sans aucune connaissance des autres
  # pipelines. supervizio/agent acquiert les MEMES VM pour ses jobs natifs (via
  # `ci-vm-up`, sous bail transactionnel cote banc) : le balayage les ramenait au
  # snapshot en plein milieu de leurs tests, et ~/build disparaissait sous le job
  # d'en face. Trace sur agent run 34877484899 — "P3 NetBSD (native)" tenait la
  # VM 211 depuis 18:31:21 ; le `vm-cleanup` du run 34880124602 de CE depot l'a
  # reinitialisee ; le scp suivant a rendu `dest open "build/..." : No such file
  # or directory`. Meme signature pour les echecs "aleatoires" OpenBSD/NetBSD et
  # pour la VM Windows qui "se tait".
  #
  # Le flock par VM ne protegeait pas de ca : il ne couvre que la duree du
  # `ci-vm-down` lui-meme, pas celle du job qui detient la VM. Et `ci-vm-down` ne
  # consulte aucun bail — c'est le chemin de LIBERATION, il efface le bail qu'il
  # trouve, y compris celui d'un autre depot.
  #
  # Desormais chaque leg publie la VM qu'il a reellement acquise (artefact
  # `vm-claim-<name>`, ecrit par l'etape "Record VM claim") et ce job ne touche
  # que cette liste. Une VM que ce run n'a jamais prise n'est jamais reinitialisee.
  report:
    name: Report Results
    # e2e-windows belongs here. Without it the aggregate reports green while
    # the Windows leg is red: it is not in needs, so its result is never read
    # and the job does not even wait for it.
    needs: [resolve, e2e-docker-amd64, e2e-docker-arm64, e2e-macos, e2e-macos-arm64, e2e-linux-artix-dinit, e2e-linux-debian-sysvinit, e2e-windows-amd64, e2e-windows-arm64,
             e2e-linux-alpine-openrc, e2e-linux-debian-systemd, e2e-linux-rocky-systemd, e2e-linux-opensuse-zypper, e2e-linux-arch-pacman,
             e2e-linux-alpine-runit, e2e-linux-alpine-s6,
             e2e-bsd-freebsd-amd64, e2e-bsd-netbsd-amd64, e2e-bsd-openbsd-amd64,
             e2e-bsd-freebsd-arm64, e2e-bsd-netbsd-arm64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # One verdict, computed once. The three consumers below (commit status,
      # dispatch callback, fail-the-job) used to each carry their own copy of
      # the same twelve-element array and the same loop — three places to keep
      # in sync, and the `skipped` bug lived in all three at once.
      - name: Compute verdict
        id: verdict
        run: |
          LEGS=(
            "docker-amd64=${{ needs.e2e-docker-amd64.result }}"
            "docker-arm64=${{ needs.e2e-docker-arm64.result }}"
            "macos-x86_64=${{ needs.e2e-macos.result }}"
            "macos-arm64=${{ needs.e2e-macos-arm64.result }}"
            "linux-artix-dinit=${{ needs.e2e-linux-artix-dinit.result }}"
            "linux-debian-sysvinit=${{ needs.e2e-linux-debian-sysvinit.result }}"
            "linux-alpine-openrc=${{ needs.e2e-linux-alpine-openrc.result }}"
            "linux-debian-systemd=${{ needs.e2e-linux-debian-systemd.result }}"
            "linux-rocky-systemd=${{ needs.e2e-linux-rocky-systemd.result }}"
            "linux-opensuse-zypper=${{ needs.e2e-linux-opensuse-zypper.result }}"
            "linux-arch-pacman=${{ needs.e2e-linux-arch-pacman.result }}"
            "linux-alpine-runit=${{ needs.e2e-linux-alpine-runit.result }}"
            "linux-alpine-s6=${{ needs.e2e-linux-alpine-s6.result }}"
            "windows-amd64=${{ needs.e2e-windows-amd64.result }}"
            "windows-arm64=${{ needs.e2e-windows-arm64.result }}"
            "bsd-freebsd-amd64=${{ needs.e2e-bsd-freebsd-amd64.result }}"
            "bsd-freebsd-arm64=${{ needs.e2e-bsd-freebsd-arm64.result }}"
            "bsd-netbsd-amd64=${{ needs.e2e-bsd-netbsd-amd64.result }}"
            "bsd-netbsd-arm64=${{ needs.e2e-bsd-netbsd-arm64.result }}"
            "bsd-openbsd-amd64=${{ needs.e2e-bsd-openbsd-amd64.result }}"
          )

          echo "=== E2E Results ==="
          BAD=0
          OFFENDERS=""
          for entry in "${LEGS[@]}"; do
            leg="${entry%%=*}"
            res="${entry#*=}"
            printf '  %-22s %s\n' "$leg" "$res"
            # Only "success" passes — `skipped` included.
            #
            # The old loop tested failure/cancelled only, so any leg that never
            # ran counted as fine. An `arm_only` dispatch skips 11 of these 12
            # and still produced a green `e2e/runner-template` on the agent SHA:
            # a verdict asserting the artifact was validated on twelve platforms
            # when it ran on one.
            if [ "$res" != "success" ]; then
              BAD=$((BAD + 1))
              OFFENDERS="${OFFENDERS}${leg}:${res} "
            fi
          done

          if [ "$BAD" -gt 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=$BAD/${#LEGS[@]} legs did not pass: ${OFFENDERS%% }" >> "$GITHUB_OUTPUT"
            echo ""
            echo "VERDICT: failure — $BAD of ${#LEGS[@]} legs did not succeed"
            echo "  $OFFENDERS"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=All ${#LEGS[@]} E2E legs passed" >> "$GITHUB_OUTPUT"
            echo ""
            echo "VERDICT: success — all ${#LEGS[@]} legs passed"
          fi

      - name: Report final status
        # !cancelled() matters now that `cancelled` counts as a failure below:
        # `if: always()` on this job makes it run even when the whole run was
        # cancelled by cancel-in-progress, and it would then post a red verdict
        # for a SHA whose superseding run goes green half an hour later.
        # A debug `arm_only` dispatch runs 4 of 26 legs. It must not write a
        # verdict at all — green would be a lie, and red would blame the SHA for
        # legs the operator chose not to run.
        if: ${{ !cancelled() && needs.resolve.outputs.sha != '' && github.event.inputs.arm_only != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESC: ${{ steps.verdict.outputs.description }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "$(jq -nc --arg s "$STATE" --arg d "$DESC" --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  '{state:$s, context:"e2e/runner-template", description:$d, target_url:$u}')"

      - name: Dispatch callback to agent repo
        # Same reason as the status above: a cancelled run must not tell agent
        # its E2E failed.
        if: ${{ !cancelled() && needs.resolve.outputs.sha != '' && github.event.inputs.arm_only != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          STATE: ${{ steps.verdict.outputs.state }}
          SOURCE_REPO: ${{ needs.resolve.outputs.source_repo }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPO}/dispatches" \
            -d "$(jq -nc --arg s "$STATE" --arg sha "${{ needs.resolve.outputs.sha }}" \
                  --arg rid "${{ github.run_id }}" \
                  --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  '{event_type:"e2e-result", client_payload:{state:$s, sha:$sha, run_id:$rid, target_url:$u}}')"
          echo "Dispatched e2e-result to ${SOURCE_REPO} (state=$STATE)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## E2E Test Results (runner-template)"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Docker amd64 | \`${{ needs.e2e-docker-amd64.result }}\` |"
            echo "| Docker arm64 | \`${{ needs.e2e-docker-arm64.result }}\` |"
            echo "| macOS x86_64 | \`${{ needs.e2e-macos.result }}\` |"
            echo "| macOS ARM64 | \`${{ needs.e2e-macos-arm64.result }}\` |"
            echo "| Linux artix-dinit | \`${{ needs.e2e-linux-artix-dinit.result }}\` |"
            echo "| Linux debian-sysvinit | \`${{ needs.e2e-linux-debian-sysvinit.result }}\` |"
            echo "| Windows amd64 | \`${{ needs.e2e-windows-amd64.result }}\` |"
            echo "| Windows arm64 | \`${{ needs.e2e-windows-arm64.result }}\` |"
            echo "| BSD freebsd amd64 | \`${{ needs.e2e-bsd-freebsd-amd64.result }}\` |"
            echo "| BSD freebsd arm64 | \`${{ needs.e2e-bsd-freebsd-arm64.result }}\` |"
            echo "| BSD netbsd amd64 | \`${{ needs.e2e-bsd-netbsd-amd64.result }}\` |"
            echo "| BSD netbsd arm64 | \`${{ needs.e2e-bsd-netbsd-arm64.result }}\` |"
            echo "| BSD openbsd amd64 | \`${{ needs.e2e-bsd-openbsd-amd64.result }}\` |"
            echo ""
            echo "**Agent ref:** \`${{ needs.resolve.outputs.ref }}\`"
            echo "**Agent SHA:** \`${{ needs.resolve.outputs.sha }}\`"
            echo "**Agent run:** \`${{ needs.resolve.outputs.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any E2E failed
        # !cancelled() for the same reason the two posting steps carry it: this
        # step used to have no guard at all, so a run superseded by
        # cancel-in-progress went red here while the posting steps deliberately
        # declined to report it — a failed job with no status explaining why.
        if: ${{ !cancelled() }}
        env:
          STATE: ${{ steps.verdict.outputs.state }}
          DESC: ${{ steps.verdict.outputs.description }}
        run: |
          if [ "$STATE" != "success" ]; then
            echo "::error::$DESC"
            exit 1
          fi
          echo "SUCCESS: $DESC"
