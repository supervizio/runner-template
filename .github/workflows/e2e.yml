          ls -l "$OPENBSD_PKG"
          # Prove it carries the NATIVE binary, not the cross one. The two are
          # distinguishable by the build path Go embeds: the bench VM builds
          # under /home/kodflow, the cross job under /home/runner/_work.
          #
          # "$TGZ", not the literal supervizio-openbsd.tgz: #84 stopped renaming
          # the package, so that name no longer exists and the `|| true` turned
          # this proof into a no-op that reported nothing for two runs. A check
          # that cannot fail is worse than no check -- it reads as coverage.
          tar xzf "$TGZ" usr/local/bin/supervizio || {
            echo "::error::could not extract the binary from $TGZ to verify its origin" >&2
            exit 1
          }
          if [ -f usr/local/bin/supervizio ]; then
            if strings usr/local/bin/supervizio | grep -q '_work/agent/agent/dist/lib/openbsd'; then
              echo "::error::this package carries the CROSS-built binary, which cannot start on OpenBSD" >&2
              exit 1
            fi
            echo "package carries a natively-built binary"
          fi
          rm -rf usr

      - name: Install, validate and uninstall in an OpenBSD guest
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          usesh: true
          # `run:` executes INSIDE the guest over ssh, and ssh forwards no
          # environment: OPENBSD_PKG was written to $GITHUB_ENV on the host, so
          # the guest saw it unset and the leg died on line 11 with "OPENBSD_PKG:
          # parameter not set" (run 35438753244). Naming it here is how the guest
          # gets it -- the same mechanism the two qemu-vm legs already use for
          # PKG, and the same lesson the qemu-vm self-test recorded when eight
          # legs failed at once for want of an `envs:`.
          envs: OPENBSD_PKG
          # Pinned, for the same reason the Windows leg pins its image: an
          # unpinned guest floats with the action's default and moves coverage
          # with no diff. matches the bench (packer pins install79.iso) and expected-matrix.json.
          # The action's default here is 7.9.
          release: '7.9'
          copyback: false
          prepare: pkg_add -I jq
          run: |
            set -e
            WS="$(pwd)"
            echo "=== Platform ==="; uname -a

            # The real install path: install.sh prefers the native package and
            # calls pkg_add, which is exactly what a user gets. No Go toolchain
            # in this guest at all any more.
            # pkg_add still answers "Can't find /tmp/supervizio-openbsd-0.0.0.tgz"
            # for a file that is demonstrably there -- install.sh's own
            # `[ -f "$SVZ_STAGED_PKG" ]` guard passed, which is how that exact
            # path reached the command line. So the path is not the problem and
            # guessing at the next one is how the last two runs were spent.
            #
            # One difference is known and unexamined: the bench guest is OpenBSD
            # 7.8, this one is 7.9. `pkg_add -v` names its objection instead of
            # collapsing every cause into "Can't find", so this step measures it
            # once and the real install below still decides the leg.
            # Everything between here and "Install (package path)" is a
            # MEASUREMENT. It must not be able to fail the leg it measures --
            # which it did in run 35444338161, where a `$RUNNER_TEMP` (a HOST
            # variable; ssh forwards no environment, so the guest saw it unset)
            # tripped `set -e` and the real install never ran at all. The leg
            # then reported the diagnostic's fault as the package's.
            #
            # `set +e` for the block, restored right after, and only guest-local
            # literal paths inside it.
            set +e
            echo "=== pkg_add diagnostics (non-fatal) ==="
            STAGED="/tmp/$(basename "$OPENBSD_PKG")"
            cp "$WS/${OPENBSD_PKG}" "$STAGED"
            ls -l "$STAGED"
            echo "--- first entries ---"; tar tzf "$STAGED" | head -5 || true
            echo "--- pkg_add -v (as published) ---"
            pkg_add -v "$STAGED" 2>&1 | head -40 || true

            # With -D unsigned the install gets past the signature and dies on
            # "archive member not found +COMMENT", for a member `tar tzf` lists.
            # pkg_add reads the stream once and in order, so the suspicion is
            # the ORDER build-pkg.sh writes (+CONTENTS +COMMENT +DESC): if
            # pkg_add wants +DESC first it consumes +COMMENT looking for it and
            # can never come back. Two alternatives, measured in this one run
            # rather than one per run -- three round trips have already gone
            # into this leg.
            # Rebuild under the name the package DECLARES. The previous
            # attempt called them varA.tgz/varB.tgz and both died on "Can't
            # find varA.tgz" -- the filename-must-match-@name rule found two
            # ticks earlier, re-proved instead of applied. The variants said
            # nothing about ordering because they never got that far.
            VA=/tmp/svz-varA
            rm -rf "$VA"; mkdir -p "$VA"
            ( cd "$VA" && tar -xzf "$WS/${OPENBSD_PKG}" )
            DECL="$(sed -n 's/^@name[[:space:]][[:space:]]*//p' "$VA/+CONTENTS" | head -1)"
            echo "declared @name = ${DECL:-<none>}"

            try_variant() {
                _label="$1"; shift
                _tgz="/tmp/${DECL}.tgz"
                rm -f "$_tgz"
                ( cd "$VA" && tar czf "$_tgz" "$@" )
                echo "--- $_label ---"
                tar tzf "$_tgz" | head -4
                pkg_add -D unsigned -v "$_tgz" 2>&1 | grep -v 'Use of uninitialized' | tail -10
                if pkg_info -q 2>/dev/null | grep -qi '^supervizio'; then
                    echo "RESULT: $_label INSTALLED"
                else
                    echo "RESULT: $_label did not install"
                fi
                for _p in $(pkg_info -q 2>/dev/null | grep -i '^supervizio' || true); do
                    pkg_delete -I "$_p" >/dev/null 2>&1
                done
                pkg_delete -I "partial-${DECL}" >/dev/null 2>&1
                rm -f "$_tgz"
            }

            try_variant "A: +CONTENTS +DESC +COMMENT" +CONTENTS +DESC +COMMENT etc usr
            try_variant "B: no +COMMENT member"       +CONTENTS +DESC etc usr
            try_variant "C: +CONTENTS only, then files" +CONTENTS etc usr
            rm -rf "$VA"
            echo "--- installed? ---"
            # Delete by the name pkg_info reports, not a guessed stem: the
            # package is supervizio-openbsd-<ver>, so `pkg_delete supervizio`
            # matches nothing and would leave the diagnostic's install in place
            # for the real one below to trip over.
            INSTALLED="$(pkg_info -q 2>/dev/null | grep -i '^supervizio' || true)"
            if [ -n "$INSTALLED" ]; then
              echo "PRESENT: $INSTALLED"
              for pkg in $INSTALLED; do pkg_delete -I "$pkg" >/dev/null 2>&1 || true; done
              echo "after delete: $(pkg_info -q 2>/dev/null | grep -ci '^supervizio' || true) left"
            else
              echo "ABSENT"
            fi
            rm -f "$STAGED"
            # Measurement over; the leg is fail-fast again from here.
            set -e

            echo "=== Install (package path) ==="
            SUPERVIZIO_LOCAL_PKG="$WS/${OPENBSD_PKG}"
            export SUPERVIZIO_LOCAL_PKG
            sh "$WS/setup/install.sh" || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "binary not installed"; exit 1; }
            # The assertion that matters here: the shipped OpenBSD binary has to
            # START. The cross-built one SIGSEGVs in ld.so before main(), so a
            # successful install proves nothing on its own.
            /usr/local/bin/supervizio --version

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh"

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            echo "=== Uninstall ==="
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh "$WS/setup/uninstall.sh"

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/bsd/openbsd-amd64\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  e2e-bsd-freebsd-arm64:
    name: E2E BSD freebsd arm64
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/bsd/freebsd-arm64","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      # The bench pulled this from zot; the hosted runner takes the same bytes
      # from the GitHub artifact agent's CI mirrors. Downloaded on the HOST and
      # synced into the guest by vmactions -- the token never enters the VM.
      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-freebsd-arm64
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify the binary arrived
        run: |
          set -euo pipefail
          ls -la bin/
          [ -s "bin/supervizio-freebsd-arm64" ] || {
            echo "::error::supervizio-freebsd-arm64 missing or empty — did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }
          mv "bin/supervizio-freebsd-arm64" bin/supervizio

      - name: Install, validate and uninstall in a freebsd guest
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          usesh: true
          # aarch64 guest on an x86_64 HOST. The action's own README is explicit:
          # "When you run with aarch64, the host runner should still be the
          # normal x86_64 runner... It's not recommended to use
          # ubuntu-24.04-arm as runner, it's much more slower." There is no
          # nested KVM on GitHub's arm64 fleet either way, so the guest is
          # TCG-emulated whichever host you pick -- measured at roughly 26x the
          # KVM path, which is why this leg budgets 180 minutes where its amd64
          # sibling needs 30.
          arch: aarch64
          # Pinned, for the same reason the Windows leg pins its image: an
          # unpinned guest floats with the action's default and moves coverage
          # with no diff. agent/e2e/expected-matrix.json expects "FreeBSD 15"; the bench builds 15.0-RELEASE.
          # The action's default here is 15.1.
          release: '15.0'
          copyback: false
          prepare: pkg install -y jq
          run: |
            set -e
            # TCG, not KVM: this guest has no physical CPU clock, so the probe
            # reports .cpu.frequency_mhz as null. The amd64 sibling runs under
            # KVM and reports one, which is why only the arm64 legs needed this.
            SVZ_EMULATED_CPU=1; export SVZ_EMULATED_CPU
            WS="$(pwd)"
            echo "=== Platform ==="; uname -a
            export SUPERVIZIO_LOCAL_BIN="$WS/bin/supervizio"
            chmod +x "$SUPERVIZIO_LOCAL_BIN"

            echo "=== Install ==="
            sh "$WS/setup/install.sh" || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh" /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            # Detection vs ground truth, ADVISORY. The freebsd-arm64 /
            # netbsd-arm64 entries in expected-matrix.json are seeded from their
            # amd64 siblings, not captured from a real arm64 guest, so a
            # mismatch means "correct the matrix" -- which is exactly what that
            # file tells you to do -- and not "fail the leg". The first real
            # capture is the authority; until then this reports without gating.
            #
            # probe-capabilities.sh, not raw `--probe`: the validator consumes
            # the capability shape the bench feeds it, and `--probe` already
            # emits JSON on its own (the `-f json` in validate-detection.sh's
            # own usage comment is stale).
            echo "=== Detection vs expected-matrix (advisory) ==="
            sh "$WS/e2e/probe-capabilities.sh" /usr/local/bin/supervizio \
               /tmp/probe-cap.json "freebsd-arm64" || true
            /usr/local/bin/supervizio --inventory all > /tmp/inventory.json 2>/dev/null || true
            if [ -s /tmp/probe-cap.json ] && [ -s /tmp/inventory.json ]; then
              sh "$WS/e2e/validate-detection.sh" "freebsd-arm64" \
                 /tmp/probe-cap.json /tmp/inventory.json --advisory \
                || echo "::warning::detection drifted from expected-matrix for freebsd-arm64 - correct e2e/expected-matrix.json"
            else
              echo "::warning::could not capture probe/inventory dumps on freebsd-arm64 - detection not checked"
            fi

            echo "=== Uninstall ==="
            # uninstall.sh PROMPTS before removing the config dir unless this is
            # set, and there is no tty here: the read either takes EOF and trips
            # `set -e`, or blocks until the job timeout. The bench leg this
            # replaces sets it; the BSDs need it most, because install.sh puts
            # their config under /usr/local/etc where the prompt actually fires.
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh "$WS/setup/uninstall.sh"
            [ -x /usr/local/bin/supervizio ] && echo "::warning::binary still present after uninstall" || true

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/bsd/freebsd-arm64\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

