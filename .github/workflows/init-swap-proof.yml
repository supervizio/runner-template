name: Init-swap proof

# =============================================================================
# Can a vmactions guest be made to boot an init OTHER than its default?
#
# This is the single experiment the whole e2e-vm migration rests on. The bench
# keeps eight Linux VMs whose only reason to exist is init diversity — Alpine
# with OpenRC / s6 / runit, Debian with systemd / SysVinit, Artix with dinit.
# Replacing them with vmactions means changing PID 1 inside a stock cloud
# image, and PID 1 cannot be changed without a reboot.
#
# `cache-after-prepare: true` is documented to run `prepare`, shut the guest
# down cleanly (VM_SHUTDOWN_CMD), snapshot the qcow2, then boot from that
# prepared image for `run`. Two things follow, and neither has been measured:
#
#   A. Does `run` really execute after a fresh boot, so a package installed in
#      `prepare` that replaces /sbin/init is actually PID 1?   → job `debian-sysvinit`
#   B. Does that boot go through the GUEST's bootloader, so an `init=` kernel
#      argument written in `prepare` takes effect?             → job `alpine-cmdline`
#
# (A) is the easy case: `apt install sysvinit-core` swaps /sbin/init on disk,
# no kernel argument needed. (B) is the hard one: Alpine's s6/runit/dinit all
# need `init=` on the command line, which only works if the action boots the
# disk rather than passing -kernel/-append from outside. If (B) fails, Alpine's
# three init legs cannot move to vmactions and need the qemu-vm action instead.
#
# ANSWERED — run 35398249387, 2026-09-18. Experiment 3 settled BOTH questions
# at once:
#
#   CMDLINE=BOOT_IMAGE=vmlinuz-virt root=LABEL=/ modules=... console=...
#           svz_bootloader_probe=1 initrd=initramfs-virt
#
# The marker was written into /boot/extlinux.conf during `prepare` and came back
# in /proc/cmdline during `run`. A kernel command line can only be set at boot,
# so its presence proves (A) a real reboot happened and the prepared image was
# reused, and (B) that boot went through the GUEST's bootloader. `init=` would
# therefore take effect too: Alpine's s6 / runit / dinit legs CAN move to
# vmactions, and the qemu-vm action is not needed for them.
#
# ALSO ANSWERED — run 35398438742, experiment 2. The swap itself worked:
#
#   INIT_TARGET now: /usr/sbin/init          (was /usr/lib/systemd/systemd)
#   ...then: Boot probe timed out; sweeping guest IPs ...
#            Boot timed out after 180 seconds. Killing QEMU and retrying...
#            Error: Boot timed out after retry. Giving up.
#
# apt replaced /sbin/init correctly and the guest NEVER CAME BACK. SysVinit alone
# does not bring up networking in an image built around systemd — there are no
# sysv-rc network scripts to run. So `debian-sysvinit` is NOT one `apt install`
# away, and the bench's hand-built VM was hand-built for a reason.
#
# Conclusion for the migration: the bootloader path is open (experiment 3), but
# each non-default init still needs its own working boot configuration. Swapping
# the init binary is necessary and nowhere near sufficient.
#
# MEASURED (run 35396732254, 2026-09-18):
#   alpine 3.23 -> PID1=init (/bin/busybox), uptime 18s,
#                  CMDLINE=BOOT_IMAGE=vmlinuz-virt root=LABEL=/ ...
#   debian 13   -> PID1=systemd, uptime 11s,
#                  CMDLINE=BOOT_IMAGE=/boot/vmlinuz-6.12.101+deb13-amd64 ...
# Both carry BOOT_IMAGE=, which is what a bootloader writes — the first real
# evidence that these guests boot their own disk rather than an external kernel.
# Note Alpine's PID 1 is busybox init, NOT openrc: openrc is the service manager
# it starts. expected-matrix.json's `init_active: openrc` describes the service
# manager, which is what agent detects via /run/openrc.
#
# Every leg is continue-on-error so one failure cannot hide the others: the
# deliverable is the EVIDENCE TABLE in the job summary, not a green tick.
#
# Runs on push only when this file itself changes, so it stays cheap and can
# live here permanently instead of being added and reverted around each test.
# =============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/init-swap-proof.yml'

permissions:
  contents: read

concurrency:
  group: init-swap-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — baselines. If these do not pass, nothing below means anything.
  # They establish what PID 1 is in a stock guest and whether the image even
  # carries a bootloader we could edit.
  # ---------------------------------------------------------------------------
  baseline-alpine:
    name: 1a baseline alpine (expect openrc)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: vmactions/alpine-vm@697847385681cdc413604693010eded91e8d9650 # v1.0.1
        with:
          release: '3.23'
          run: |
            echo "=== 1a BASELINE alpine ==="
            echo "PID1=$(cat /proc/1/comm 2>/dev/null || echo UNKNOWN)"
            echo "UPTIME=$(cut -d. -f1 /proc/uptime)s"
            echo "CMDLINE=$(cat /proc/cmdline)"
            echo "INIT_TARGET=$(readlink -f /sbin/init 2>/dev/null || echo none)"
            echo "BOOTLOADER:"
            ls -1 /boot 2>/dev/null | sed 's/^/  /' || echo "  (no /boot)"
            echo "--- can we even install the alternative inits? ---"
            apk add --no-cache s6 s6-linux-init runit dinit 2>&1 | tail -5
            echo "s6-svscan: $(command -v s6-svscan || echo MISSING)"
            echo "runit:     $(command -v runit || echo MISSING)"
            echo "dinit:     $(command -v dinit || echo MISSING)"

  baseline-debian:
    name: 1b baseline debian (expect systemd)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: vmactions/debian-vm@389ba1da28ff5b440cba52db8e03fc2e08e2affa # v1.0.0
        with:
          release: '13'
          run: |
            echo "=== 1b BASELINE debian ==="
            echo "PID1=$(cat /proc/1/comm 2>/dev/null || echo UNKNOWN)"
            echo "UPTIME=$(cut -d. -f1 /proc/uptime)s"
            echo "CMDLINE=$(cat /proc/cmdline)"
            echo "INIT_TARGET=$(readlink -f /sbin/init 2>/dev/null || echo none)"
            echo "BOOTLOADER:"
            ls -1 /boot 2>/dev/null | sed 's/^/  /' || echo "  (no /boot)"

  # ---------------------------------------------------------------------------
  # Tier 2 — QUESTION A: does cache-after-prepare really reboot?
  #
  # sysvinit-core replaces /sbin/init on disk. No kernel argument is involved,
  # so this isolates the reboot itself. If PID1 comes back as `init` rather than
  # `systemd`, the mechanism is real and debian-sysvinit can leave the bench.
  # ---------------------------------------------------------------------------
  debian-sysvinit:
    name: 2 debian + sysvinit-core + ifupdown (expect PID1=init)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: vmactions/debian-vm@389ba1da28ff5b440cba52db8e03fc2e08e2affa # v1.0.0
        with:
          release: '13'
          cache-after-prepare: true
          prepare: |
            export DEBIAN_FRONTEND=noninteractive
            echo "--- BEFORE (inside prepare) ---"
            echo "PID1=$(cat /proc/1/comm)"
            ip -o link | awk -F': ' '{print "  iface: "$2}'
            apt-get update -qq

            # Networking FIRST, and this is the whole lesson of the previous
            # attempt. A Debian cloud image brings its interface up through
            # systemd-networkd/cloud-init. Remove systemd and nothing runs them,
            # so the guest boots with no address, sshd never answers, and the
            # action waits until it gives up -- which is exactly what happened:
            # the swap SUCCEEDED and the VM simply never came back.
            #
            # ifupdown + /etc/network/interfaces is the sysvinit-era equivalent,
            # and its /etc/init.d/networking script runs under SysVinit.
            apt-get install -y -qq ifupdown isc-dhcp-client
            IFACE=$(ip -o link | awk -F': ' '$2 != "lo" {print $2; exit}')
            echo "configuring $IFACE (and eth0) for ifupdown"
            # BOTH names, deliberately. Predictable interface names (ens4) are
            # produced by systemd-udevd's net_id builtin. Removing systemd-sysv
            # can leave udevd unstarted, in which case the kernel keeps the
            # legacy name and the interface comes back as eth0 -- so an
            # interfaces file naming only ens4 configures a device that does not
            # exist, DHCP never runs, and slirp sees no guest traffic at all.
            # That is exactly what the previous run reported.
            # allow-hotplug rather than auto: a missing device is then skipped
            # instead of failing the whole networking script.
            cat > /etc/network/interfaces <<EOF
            auto lo
            iface lo inet loopback
            allow-hotplug $IFACE
            iface $IFACE inet dhcp
            allow-hotplug eth0
            iface eth0 inet dhcp
            EOF
            # These ship /etc/init.d scripts in trixie (verified), but a cloud
            # image leaves them disabled because systemd units drive them. Use
            # `enable`, not `defaults`: defaults is a no-op when the links are
            # already present but pointing at a disabled state.
            update-rc.d networking defaults >/dev/null 2>&1 || true
            update-rc.d networking enable   >/dev/null 2>&1 || true
            update-rc.d ssh defaults        >/dev/null 2>&1 || true
            update-rc.d ssh enable          >/dev/null 2>&1 || true
            # udev under sysvinit, so device naming and hotplug still happen.
            [ -x /etc/init.d/udev ] && { update-rc.d udev defaults >/dev/null 2>&1 || true; }
            echo "--- runlevel links ---"
            ls -1 /etc/rc2.d/ 2>/dev/null | head -20
            echo "--- inittab present? ---"
            [ -f /etc/inittab ] && head -5 /etc/inittab || echo "NO /etc/inittab (SysVinit has nothing to run)"
            # BOTH options are required, and each was found the hard way:
            #
            #  * `systemd-sysv-` (trailing dash = remove in the same
            #    transaction). Without it apt refuses to choose the removal
            #    itself: "Reached two conflicting decisions", exit 100.
            #  * `--allow-remove-essential`. systemd-sysv is Essential, and with
            #    -y apt will not drop an Essential package silently:
            #    "Essential packages were removed and -y was used without
            #    --allow-remove-essential", exit 100 again.
            #
            # Either flag alone fails, which is why this took three runs.
            apt-get install -y -qq --allow-remove-essential sysvinit-core systemd-sysv-
            echo "INIT_TARGET now: $(readlink -f /sbin/init)"
            echo "sysvinit installed: $(dpkg -l sysvinit-core 2>/dev/null | tail -1)"
          run: |
            echo "=== 2 debian + sysvinit-core ==="
            echo "PID1=$(cat /proc/1/comm 2>/dev/null || echo UNKNOWN)"
            echo "UPTIME=$(cut -d. -f1 /proc/uptime)s"
            echo "CMDLINE=$(cat /proc/cmdline)"
            echo "INIT_TARGET=$(readlink -f /sbin/init 2>/dev/null || echo none)"
            echo "BOOTLOADER:"
            ls -1 /boot 2>/dev/null | sed 's/^/  /' || echo "  (no /boot)"
            echo ""
            if [ "$(cat /proc/1/comm)" = "init" ]; then
              echo "RESULT: PASS - cache-after-prepare rebooted into the swapped init"
            else
              echo "RESULT: FAIL - PID1 is still $(cat /proc/1/comm); no real reboot"
            fi

  # ---------------------------------------------------------------------------
  # Tier 3 — QUESTION B: does the reboot honour the guest's bootloader?
  #
  # Alpine's s6, runit and dinit all need `init=` on the kernel command line, and
  # Alpine boots via extlinux/syslinux, so `prepare` edits /boot/extlinux.conf.
  # What is appended is a harmless unknown parameter, not `init=`: the kernel
  # ignores it and passes it through to /proc/cmdline, so it answers the same
  # question without any chance of leaving an unbootable guest. If the marker
  # survives the reboot, `init=` would too and all three legs can move; if not,
  # they need the qemu-vm action.
  # ---------------------------------------------------------------------------
  alpine-cmdline:
    name: 3 alpine + harmless cmdline marker (expect it to survive the reboot)
    runs-on: ubuntu-24.04
    continue-on-error: true
    # A guest that never comes back leaves the action waiting on SSH, and the
    # job default is 360 minutes. The first attempt at this experiment did
    # exactly that.
    timeout-minutes: 25
    steps:
      - uses: vmactions/alpine-vm@697847385681cdc413604693010eded91e8d9650 # v1.0.1
        with:
          release: '3.23'
          cache-after-prepare: true
          prepare: |
            echo "--- BEFORE (inside prepare) ---"
            echo "PID1=$(cat /proc/1/comm)"
            echo "CMDLINE=$(cat /proc/cmdline)"
            apk add --no-cache dinit runit s6
            echo "dinit: $(command -v dinit)  runit: $(command -v runit)  s6: $(command -v s6-svscan)"
            echo "--- bootloader config found ---"
            for f in /boot/extlinux.conf /extlinux.conf /boot/syslinux/syslinux.cfg /boot/grub/grub.cfg; do
              [ -f "$f" ] && { echo "FOUND $f"; cat "$f"; }
            done
            # A MARKER, not `init=`.
            #
            # The first version of this experiment appended init=/sbin/dinit.
            # dinit has no /etc/dinit.d configuration in a stock image, so if the
            # bootloader IS honoured the guest boots into an init that cannot
            # bring the system up, SSH never returns, and the job hangs until the
            # 6-hour default timeout. Testing "is the bootloader honoured" by
            # breaking the boot answers the question only by failing.
            #
            # An unknown kernel parameter is ignored by the kernel and passed
            # through to /proc/cmdline, so it answers exactly the same question
            # and always leaves a bootable guest.
            for f in /boot/extlinux.conf /extlinux.conf /boot/syslinux/syslinux.cfg; do
              if [ -f "$f" ]; then
                sed -i 's#^\(\s*APPEND\s.*\)#\1 svz_bootloader_probe=1#I' "$f"
                echo "--- PATCHED $f ---"
                cat "$f"
              fi
            done
          run: |
            echo "=== 3 alpine + cmdline marker ==="
            echo "PID1=$(cat /proc/1/comm 2>/dev/null || echo UNKNOWN)"
            echo "UPTIME=$(cut -d. -f1 /proc/uptime)s"
            echo "CMDLINE=$(cat /proc/cmdline)"
            echo "INIT_TARGET=$(readlink -f /sbin/init 2>/dev/null || echo none)"
            echo "DINIT_PERSISTED=$(command -v dinit || echo MISSING)"
            echo ""
            case "$(cat /proc/cmdline)" in
              *svz_bootloader_probe=1*)
                echo "RESULT: PASS - the guest bootloader was honoured."
                echo "  init= would reach the kernel too, so Alpine's s6/runit/dinit"
                echo "  legs can move to vmactions." ;;
              *)
                echo "RESULT: FAIL - the marker did not reach the kernel."
                echo "  The action boots the kernel externally (-kernel/-append), so"
                echo "  Alpine's s6/runit/dinit legs need the qemu-vm action instead." ;;
            esac
            echo ""
            if [ "$(command -v dinit)" = "" ]; then
              echo "NOTE: dinit is gone, so the prepared image was NOT reused at all."
            else
              echo "NOTE: dinit persisted, so cache-after-prepare did reuse the prepared image."
            fi

  verdict:
    name: Evidence table
    needs: [baseline-alpine, baseline-debian, debian-sysvinit, alpine-cmdline]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarise
        run: |
          {
            echo "## Init-swap proof"
            echo ""
            echo "Read the individual job logs for PID1 / CMDLINE / bootloader evidence."
            echo "These outcomes are job-level only; the conclusions live in the logs."
            echo ""
            echo "| # | Experiment | Outcome |"
            echo "|---|-----------|---------|"
            echo "| 1a | baseline alpine | \`${{ needs.baseline-alpine.result }}\` |"
            echo "| 1b | baseline debian | \`${{ needs.baseline-debian.result }}\` |"
            echo "| 2 | debian + sysvinit-core (does it reboot?) | \`${{ needs.debian-sysvinit.result }}\` |"
            echo "| 3 | alpine + cmdline marker (bootloader honoured?) | \`${{ needs.alpine-cmdline.result }}\` |"
            echo ""
            echo "**What each answers**"
            echo ""
            echo "- **2 green** → \`cache-after-prepare\` genuinely reboots; \`debian-sysvinit\` can leave the bench."
            echo "- **3 green** → the guest bootloader is honoured; Alpine's s6 / runit / dinit legs can leave too."
            echo "- **3 red** → those three need the \`qemu-vm\` action; everything else still migrates."
          } >> "$GITHUB_STEP_SUMMARY"
