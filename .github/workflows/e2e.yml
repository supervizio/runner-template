name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag of agent to test'
        required: true
        default: 'main'
      run_id:
        description: 'Agent CI run ID for artifact download'
        required: true
      sha:
        description: 'Commit SHA for status reporting (optional)'
        required: false
      arm_only:
        description: 'Run only the arm64 e2e jobs (skip amd64/VM)'
        required: false
        default: 'false'
  repository_dispatch:
    types: [run-e2e]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.client_payload.sha || inputs.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # RESOLVE: Normalize inputs from workflow_dispatch vs repository_dispatch
  # ===========================================================================

  resolve:
    name: Resolve Inputs
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      sha: ${{ steps.resolve.outputs.sha }}
      source_repo: ${{ steps.resolve.outputs.source_repo }}
    steps:
      - name: Resolve dispatch parameters
        id: resolve
        env:
          PAYLOAD_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.client_payload.run_id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
          fi
          # The dispatch payload has carried source_repo from the start but
          # nothing ever read it -- every consumer hardcoded supervizio/agent.
          # Read it now (the artifact download needs it), defaulting to that
          # same value so in-flight dispatches and workflow_dispatch runs, which
          # send no such field, behave exactly as before.
          #
          # ALLOWLISTED, and that is load-bearing. This value steers both the
          # private `actions/checkout` and the cross-repo artifact download, and
          # the jobs that consume it then EXECUTE scripts out of that checkout --
          # setup/install.sh as root in a guest, and setup/fetch-libprobe.sh with
          # LIBPROBE_REPO_TOKEN in its step env. Left unconstrained it would turn
          # "can dispatch a test run" into "can run arbitrary code next to a
          # private-repo credential". Checked once here rather than trusted at
          # each of the ten use sites.
          #
          # Read through env, not interpolated into the script: a repository name
          # is attacker-supplied text and template interpolation pastes it verbatim
          # (and into $GITHUB_OUTPUT, where a newline would let it set other
          # outputs).
          # The allowlist is agent-only, deliberately. An earlier revision also
          # accepted supervizio/libprobe, which was wrong twice over: this
          # workflow's checkouts and every status post authenticate with
          # AGENT_REPO_TOKEN, which cannot reach libprobe, so a libprobe-sourced
          # dispatch would have 404'd on checkout after posting a run's worth of
          # statuses against a SHA that does not exist in agent. libprobe has its
          # own lane, external-e2e.yml, with its own token and its own contract.
          # Widening this list is not a config change -- it needs a token and a
          # status target to match.
          SOURCE_REPO="${PAYLOAD_SOURCE_REPO:-supervizio/agent}"
          case "$SOURCE_REPO" in
            supervizio/agent) ;;
            *)
              echo "::error::refusing source_repo '$SOURCE_REPO' - e2e.yml serves supervizio/agent only (libprobe uses external-e2e.yml)" >&2
              exit 1 ;;
          esac
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"

      # Fail here, in ten seconds, or fail twenty-six times in twenty minutes.
      #
      # Every leg downloads a build artifact from the agent run that dispatched
      # this one. When that run produced none, each leg discovers it separately
      # and dies at its own download step. That used to cost more than noise:
      # two of those legs ran on the shared self-hosted pod and had started
      # acquiring a Proxmox guest by then. Run 35446185851 did exactly that: 13
      # legs red for one cause, while agent's own CI queued behind the ARC slots its
      # own dispatch was holding.
      #
      # `needs: [resolve]` means a failure here skips the whole matrix instead.
      - name: Check the agent run actually produced artifacts
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          SRC_REPO: ${{ steps.resolve.outputs.source_repo }}
          SRC_RUN: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::AGENT_REPO_TOKEN not set - cannot pre-check artifacts, letting the legs try"
            exit 0
          fi
          names="$(gh api --paginate "repos/$SRC_REPO/actions/runs/$SRC_RUN/artifacts?per_page=100"                      --jq '.artifacts[].name' 2>/dev/null | sort -u || true)"
          count="$(printf '%s' "$names" | grep -c . || true)"
          echo "run $SRC_RUN carries $count artifact(s)"
          printf '%s\n' "$names" | sed 's/^/  /'
          # linux-amd64 is the floor: the docker legs cannot run without it, and
          # no useful subset of this matrix exists when it is missing.
          if ! printf '%s\n' "$names" | grep -qx 'supervizio-linux-amd64'; then
            echo "::error::agent run $SRC_RUN published no supervizio-linux-amd64 - nothing here can be tested. If that run is green, the artifact bridge is what is missing (supervizio/agent#202); if it is still going, dispatch again once it finishes." >&2
            exit 1
          fi
          # Advisory, not fatal: this one comes from a job that only runs on a
          # bench dispatch, so its absence is expected until a hosted build
          # replaces it (supervizio/agent#211, which also needs wiring into
          # ci.yml before it produces anything). The openbsd leg reports its
          # own red, which is the honest place for it.
          if ! printf '%s\n' "$names" | grep -qx 'supervizio-openbsd-pkg'; then
            echo "::warning::no supervizio-openbsd-pkg in run $SRC_RUN - e2e-bsd-openbsd-amd64 will fail. Its only producer is agent's native-openbsd job, gated off since agent#205; agent#211 replaces it with a hosted build and still needs wiring into ci.yml."
          fi

      - name: Display resolved parameters
        run: |
          echo "Agent ref:    ${{ steps.resolve.outputs.ref }}"
          echo "Agent run ID: ${{ steps.resolve.outputs.run_id }}"
          echo "Agent SHA:    ${{ steps.resolve.outputs.sha }}"
          echo "Source repo:  ${{ steps.resolve.outputs.source_repo }}"

  # ===========================================================================
  # E2E DOCKER (amd64)
  # ===========================================================================

  e2e-docker-amd64:
    name: E2E Docker amd64 ${{ matrix.name }}
    needs: [resolve]
    if: ${{ github.event.inputs.arm_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-glibc
            dockerfile: Dockerfile.debian-script
            artifact: supervizio-linux-amd64
            description: "Debian with glibc (systemd)"
          - name: alpine-musl
            dockerfile: Dockerfile.alpine-script
            artifact: supervizio-linux-amd64-musl
            description: "Alpine with musl (OpenRC)"
          - name: scratch
            dockerfile: Dockerfile.scratch
            artifact: supervizio-linux-amd64-musl
            description: "Scratch (static binary, no OS)"
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/docker/${{ matrix.name }}","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          # The workspace is synced wholesale into guests and read by later
          # steps; a persisted credential would travel with it as a base64
          # AUTHORIZATION header that Actions log-masking does not cover.
          persist-credentials: false

      # e2e-docker used to init the libprobe submodule because it BUILT the
      # binary. It now downloads one, and none of the three Dockerfiles reads
      # third_party/libprobe -- they copy bin/ and setup/ only. Keeping the
      # step meant an unset or expired LIBPROBE_REPO_TOKEN reddened a job with
      # no dependency on it, and fattened the docker build context, since
      # .dockerignore excludes **/target but not third_party.

      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.artifact }}
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          # Needs actions:read on the agent repo, on top of the contents:read
          # this token already carries for the checkout above.
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify the binary arrived
        run: |
          set -euo pipefail
          ls -la bin/
          # A silently-empty download would surface much later as a confusing
          # docker build error; fail here, where the cause is obvious.
          [ -s "bin/${{ matrix.artifact }}" ] || {
            echo "::error::${{ matrix.artifact }} missing or empty — did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }

      - name: Prepare binary
        run: |
          ls -la bin/
          chmod +x bin/${{ matrix.artifact }}
          if [ "${{ matrix.dockerfile }}" = "Dockerfile.scratch" ]; then
            mv bin/${{ matrix.artifact }} bin/supervizio
          elif [ "${{ matrix.artifact }}" != "supervizio-linux-amd64" ]; then
            mv bin/${{ matrix.artifact }} bin/supervizio-linux-amd64
          fi
          file bin/supervizio* | head -5

      # The dind-sidecar wait this replaced (issue #15) was about the ARC pod's
      # dockerd racing the first build on tcp://localhost:2375. A GitHub-hosted
      # runner ships a local dockerd that is already up, so there is nothing to
      # race; one assertion is enough to keep the failure legible if that ever
      # stops being true.
      - name: Check Docker is available
        run: docker info >/dev/null

      - name: Build container
        run: |
          docker build -f e2e/${{ matrix.dockerfile }} -t supervizio-e2e:${{ matrix.name }}-amd64 .

      - name: Test container startup
        run: |
          docker run --rm supervizio-e2e:${{ matrix.name }}-amd64

      - name: Validate probe metrics
        if: matrix.dockerfile != 'Dockerfile.scratch'
        run: |
          docker run --rm --entrypoint sh supervizio-e2e:${{ matrix.name }}-amd64 -c "
            set -e
            echo '=== System Info ==='
            uname -a
            cat /etc/os-release 2>/dev/null || true

            echo ''
            echo '=== Running --probe ==='
            OUTPUT=\$(/usr/local/bin/supervizio --probe 2>&1) || {
              echo 'ERROR: --probe failed'
              echo \"Output: \$OUTPUT\"
              exit 1
            }

            echo 'Raw JSON:'
            echo \"\$OUTPUT\"

            echo ''
            echo '=== Validation ==='
            echo \"\$OUTPUT\" | jq -e '.timestamp' > /dev/null && echo 'OK timestamp'
            echo \"\$OUTPUT\" | jq -e '.os.platform' > /dev/null && echo 'OK platform'
            echo \"\$OUTPUT\" | jq -r '.cpu.cores // \"null\"' | xargs -I {} echo 'cpu.cores = {}'

            echo \"\$OUTPUT\" | jq -e '.timestamp and .os.platform and .cpu.cores > 0' && \\
              echo 'OK Probe validation passed: ${{ matrix.description }}'
          "

      - name: Test scratch container (no shell)
        if: matrix.dockerfile == 'Dockerfile.scratch'
        run: |
          echo "=== Testing scratch container (static binary, no OS) ==="

          echo "--- Test --version ---"
          docker run --rm supervizio-e2e:scratch-amd64 --version
          echo "OK --version works"

          echo ""
          echo "--- Test --probe ---"
          OUTPUT=$(docker run --rm supervizio-e2e:scratch-amd64 --probe 2>&1) || {
            echo "ERROR: --probe failed"
            echo "Output: $OUTPUT"
            exit 1
          }
          echo "Probe output:"
          echo "$OUTPUT"

          echo ""
          echo "--- Validate JSON ---"
          echo "$OUTPUT" | jq -e '.timestamp' > /dev/null && echo "OK timestamp present"
          echo "$OUTPUT" | jq -e '.os.platform' > /dev/null && echo "OK platform present"
          echo "$OUTPUT" | jq -e '.cpu.cores > 0' > /dev/null && echo "OK cpu.cores > 0"
          echo "$OUTPUT" | jq -e '.memory.total_bytes > 0' > /dev/null && echo "OK memory.total_bytes > 0"

          echo ""
          echo "OK Scratch container tests passed"

      - name: Save probe capabilities
        if: always()
        continue-on-error: true
        run: |
          PLATFORM="docker-${{ matrix.name }}"
          if [ "${{ matrix.dockerfile }}" = "Dockerfile.scratch" ]; then
            OUTPUT=$(docker run --rm supervizio-e2e:scratch-amd64 --probe 2>/dev/null) || true
          else
            OUTPUT=$(docker run --rm --entrypoint sh supervizio-e2e:${{ matrix.name }}-amd64 -c \
              '/usr/local/bin/supervizio --probe 2>/dev/null') || true
          fi
          if [ -n "$OUTPUT" ] && echo "$OUTPUT" | jq -e '.' >/dev/null 2>&1; then
            echo "$OUTPUT" | jq --arg p "$PLATFORM" '. + {"_platform": $p}' > "probe-cap-${PLATFORM}.json"
          else
            printf '{"_platform":"%s","_error":true}\n' "$PLATFORM" > "probe-cap-${PLATFORM}.json"
          fi
          echo "Probe capabilities for ${PLATFORM}:"
          cat "probe-cap-${PLATFORM}.json" | jq -r '._platform, .container.is_containerized // "N/A", .os.platform // "N/A"' 2>/dev/null || true

      - name: Upload probe capabilities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-cap-docker-${{ matrix.name }}
          path: probe-cap-docker-${{ matrix.name }}.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          STATE="success"
          DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then
            STATE="failure"
            DESC="Failed"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/docker/${{ matrix.name }}\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # ===========================================================================
  # E2E DOCKER ARM64
  # ===========================================================================

  e2e-docker-arm64:
    name: E2E Docker arm64 ${{ matrix.name }}
    needs: [resolve]
    # GitHub-hosted native arm64 runner: real Docker (no DinD sidecar, no QEMU)
    # and a native aarch64 toolchain. The binary is built natively here rather
    # than pulled from the lab zot store (unreachable from a hosted runner).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-glibc
            dockerfile: Dockerfile.debian-script
            libc: glibc
            artifact: supervizio-linux-arm64
            binary_name: supervizio-linux-amd64
            description: "Debian ARM64 with glibc (systemd)"
          - name: alpine-musl
            dockerfile: Dockerfile.alpine-script
            libc: musl
            artifact: supervizio-linux-arm64-musl
            binary_name: supervizio-linux-amd64
            description: "Alpine ARM64 with musl (OpenRC)"
          - name: scratch
            dockerfile: Dockerfile.scratch
            libc: musl
            artifact: supervizio-linux-arm64-musl
            binary_name: supervizio
            description: "Scratch ARM64 (static binary, no OS)"
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/docker-arm64/${{ matrix.name }}","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          # The workspace is synced wholesale into guests and read by later
          # steps; a persisted credential would travel with it as a base64
          # AUTHORIZATION header that Actions log-masking does not cover.
          persist-credentials: false

      # This leg used to install Go, Rust and Zig and compile the agent from
      # source before testing it -- so what it validated was a rebuild on a
      # different toolchain, not the binary the release ships. That is the exact
      # thing this migration exists to remove, and it survived here only because
      # zot was unreachable from a hosted runner. agent now bridges the arm64
      # binaries, so this consumes the shipped bytes like every other leg.
      #
      # The libprobe submodule init went with the build: nothing in the three
      # Dockerfiles reads third_party/libprobe, they copy bin/ and setup/.
      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.artifact }}
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify and place the binary
        run: |
          set -euo pipefail
          ls -la bin/
          [ -s "bin/${{ matrix.artifact }}" ] || {
            echo "::error::${{ matrix.artifact }} missing or empty - did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }
          chmod +x "bin/${{ matrix.artifact }}"
          # The three Dockerfiles hardcode `COPY bin/supervizio-linux-amd64`
          # (and bin/supervizio for scratch) regardless of architecture -- they
          # are shared with the amd64 leg. So an arm64 binary has to land under
          # the amd64 name. Ugly, but it is the existing contract, and the
          # previous build-from-source step did exactly the same rename.
          if [ "${{ matrix.dockerfile }}" = "Dockerfile.scratch" ]; then
            mv "bin/${{ matrix.artifact }}" bin/supervizio
          else
            mv "bin/${{ matrix.artifact }}" bin/supervizio-linux-amd64
          fi
          file bin/supervizio* | head -3

      - name: Build container
        run: |
          # Native aarch64 host + native image: plain docker build, no QEMU.
          docker build -f e2e/${{ matrix.dockerfile }} -t supervizio-e2e:${{ matrix.name }}-arm64 .

      - name: Test container startup
        run: |
          docker run --rm --platform linux/arm64 supervizio-e2e:${{ matrix.name }}-arm64

      - name: Validate probe metrics
        if: matrix.dockerfile != 'Dockerfile.scratch'
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh supervizio-e2e:${{ matrix.name }}-arm64 -c "
            set -e
            echo '=== System Info ==='
            uname -a
            cat /etc/os-release 2>/dev/null || true

            echo ''
            echo '=== Running --probe ==='
            OUTPUT=\$(/usr/local/bin/supervizio --probe 2>&1) || {
              echo 'ERROR: --probe failed'
              echo \"Output: \$OUTPUT\"
              exit 1
            }

            echo 'Raw JSON:'
            echo \"\$OUTPUT\"

            echo ''
            echo '=== Validation ==='
            echo \"\$OUTPUT\" | jq -e '.timestamp' > /dev/null && echo 'OK timestamp'
            echo \"\$OUTPUT\" | jq -e '.os.platform' > /dev/null && echo 'OK platform'
            echo \"\$OUTPUT\" | jq -r '.cpu.cores // \"null\"' | xargs -I {} echo 'cpu.cores = {}'

            echo \"\$OUTPUT\" | jq -e '.timestamp and .os.platform and .cpu.cores > 0' && \\
              echo 'OK Probe validation passed: ${{ matrix.description }}'
          "

      - name: Test scratch container (no shell)
        if: matrix.dockerfile == 'Dockerfile.scratch'
        run: |
          echo "=== Testing scratch container (static binary, no OS) ==="

          echo "--- Test --version ---"
          docker run --rm --platform linux/arm64 supervizio-e2e:scratch-arm64 --version
          echo "OK --version works"

          echo ""
          echo "--- Test --probe ---"
          OUTPUT=$(docker run --rm --platform linux/arm64 supervizio-e2e:scratch-arm64 --probe 2>&1) || {
            echo "ERROR: --probe failed"
            echo "Output: $OUTPUT"
            exit 1
          }
          echo "Probe output:"
          echo "$OUTPUT"

          echo ""
          echo "--- Validate JSON ---"
          echo "$OUTPUT" | jq -e '.timestamp' > /dev/null && echo "OK timestamp present"
          echo "$OUTPUT" | jq -e '.os.platform' > /dev/null && echo "OK platform present"
          echo "$OUTPUT" | jq -e '.cpu.cores > 0' > /dev/null && echo "OK cpu.cores > 0"
          echo "$OUTPUT" | jq -e '.memory.total_bytes > 0' > /dev/null && echo "OK memory.total_bytes > 0"

          echo ""
          echo "OK Scratch ARM64 container tests passed"

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          STATE="success"
          DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then
            STATE="failure"
            DESC="Failed"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/docker-arm64/${{ matrix.name }}\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # ===========================================================================
  # E2E macOS (Intel)
  # ===========================================================================

  e2e-macos:
    name: E2E macOS x86_64
    needs: [resolve]
    # macos-15-intel matches what agent's e2e/expected-matrix.json pins
    # darwin-amd64 to. It replaces bench VM 215 "sequoia" — an OpenCore
    # hackintosh that Packer cannot build (manual VNC install, 30-60 min by
    # hand), pinned 16 GiB with ballooning disabled on a bench that runs with
    # ~29 GiB of slack. Note GitHub retires x86_64 macOS runners in August 2027;
    # this leg has a deadline either way, which is an argument for renting one
    # rather than maintaining one.
    runs-on: macos-15-intel
    timeout-minutes: 15
    if: ${{ github.event.inputs.arm_only != 'true' }}
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/macos-x86_64","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      # The bench leg pulled this from zot ON the VM, because sequoia sat on the
      # lab subnet. A hosted runner does not, so it comes from the GitHub
      # artifact agent's CI now mirrors — the same binary, one hop instead of
      # three, and no oras/brew bootstrap inside the guest.
      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-darwin-amd64
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Prepare binary
        run: |
          set -euo pipefail
          ls -la bin/
          [ -s bin/supervizio-darwin-amd64 ] || {
            echo "::error::supervizio-darwin-amd64 missing or empty — did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }
          mv bin/supervizio-darwin-amd64 bin/supervizio
          chmod +x bin/supervizio

      - name: Probe validation
        run: |
          set -euo pipefail
          echo "=== System ==="; uname -a; sw_vers || true
          echo "=== version ==="; bin/supervizio --version
          echo "=== probe ==="
          OUT=$(bin/supervizio --probe 2>&1) || { echo "::error::probe failed: $OUT"; exit 1; }
          echo "$OUT" | jq -e 'type=="object"' >/dev/null
          # Not `<assert> && echo ...`: a failing left operand that is not the
          # last command in the step does NOT trip `set -e`, so a probe
          # reporting cpu.cores == 0 would pass.
          echo "$OUT" | jq -e '.timestamp and .os.platform and .cpu.cores > 0' >/dev/null
          echo "OK probe validation passed on macOS x86_64"
          echo "$OUT" | jq --arg p darwin-amd64 '. + {"_platform":$p}' > probe-cap-darwin-amd64.json

      - name: Upload probe capabilities
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-cap-darwin-amd64
          path: probe-cap-darwin-amd64.json
          retention-days: 1
          if-no-files-found: ignore

      # New coverage, not a port. The bench leg stopped at --version and a probe
      # JSON shape check; its arm64 twin has always run the battery. Running it
      # here too means macOS x86_64 finally proves the supervisor's restart,
      # exit-code, rlimit and SIGKILL behaviour instead of only proving the
      # binary starts.
      - name: Supervision scenarios
        run: |
          chmod +x e2e/scenario-battery.sh
          e2e/scenario-battery.sh "$PWD/bin/supervizio"

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/macos-x86_64\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  e2e-macos-arm64:
    name: E2E macOS ARM64
    needs: [resolve]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/macos-arm64","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          # The workspace is synced wholesale into guests and read by later
          # steps; a persisted credential would travel with it as a base64
          # AUTHORIZATION header that Actions log-masking does not cover.
          persist-credentials: false

      # This leg used to install Go and Rust and build darwin-arm64 from source,
      # so it validated a rebuild rather than the binary the release ships --
      # the one thing this migration exists to remove. It survived here because
      # zot is unreachable from a hosted runner; agent now bridges the artifact.
      #
      # The libprobe submodule init goes with the build: nothing left in this
      # job reads third_party/libprobe.
      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-darwin-arm64
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify and place the binary
        run: |
          set -euo pipefail
          ls -la bin/
          [ -s bin/supervizio-darwin-arm64 ] || {
            echo "::error::supervizio-darwin-arm64 missing or empty - did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }
          # The steps below expect $GITHUB_WORKSPACE/bin/supervizio, which is
          # where the build step used to put it.
          mv bin/supervizio-darwin-arm64 bin/supervizio
          chmod +x bin/supervizio
          file bin/supervizio

      - name: Run macOS ARM64 E2E test
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          chmod +x bin/supervizio

          echo "=== System Info ==="
          uname -a
          sysctl hw.ncpu || true
          sw_vers || true

          echo ""
          echo "=== Test version ==="
          bin/supervizio --version

          echo ""
          echo "=== Test probe ==="
          OUTPUT=$(bin/supervizio --probe 2>&1) || {
            echo "ERROR: --probe command failed with exit code $?"
            echo "Output: $OUTPUT"
            exit 1
          }

          echo "Raw JSON output:"
          echo "$OUTPUT"

          echo ""
          echo "=== Validate JSON structure ==="
          echo "$OUTPUT" | jq -e 'type == "object"' > /dev/null || {
            echo "ERROR: Output is not valid JSON object"
            exit 1
          }

          echo "Checking required fields..."
          echo "$OUTPUT" | jq -e '.timestamp' > /dev/null && echo "OK timestamp present"
          echo "$OUTPUT" | jq -e '.os.platform' > /dev/null && echo "OK platform present"
          echo "$OUTPUT" | jq -e '.cpu' > /dev/null && echo "OK cpu present" || echo "FAIL cpu MISSING"
          echo "$OUTPUT" | jq -r '.cpu.cores // "null"' | xargs -I {} echo "  cpu.cores = {}"

          echo ""
          echo "=== Final validation ==="
          echo "$OUTPUT" | jq -e '.timestamp and .os.platform and .cpu.cores > 0' && \
            echo "OK Probe validation passed on macOS ARM64"

      - name: Save probe capabilities
        if: always()
        continue-on-error: true
        run: |
          PLATFORM="darwin-arm64"
          OUTPUT=$(./bin/supervizio --probe 2>/dev/null) || true
          if [ -n "$OUTPUT" ] && echo "$OUTPUT" | jq -e '.' >/dev/null 2>&1; then
            echo "$OUTPUT" | jq --arg p "$PLATFORM" '. + {"_platform": $p}' > "probe-cap-${PLATFORM}.json"
          else
            printf '{"_platform":"%s","_error":true}\n' "$PLATFORM" > "probe-cap-${PLATFORM}.json"
          fi

      - name: Upload probe capabilities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-cap-darwin-arm64
          path: probe-cap-darwin-arm64.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Supervision scenarios
        run: |
          # Prove the supervisor's restart/exit/limit/SIGKILL reactions on macOS.
          chmod +x e2e/scenario-battery.sh
          e2e/scenario-battery.sh "$PWD/bin/supervizio"

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "AGENT_REPO_TOKEN not set, skipping"; exit 0; }
          STATE="success"
          DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then
            STATE="failure"
            DESC="Failed"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/macos-arm64\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # ===========================================================================
  # E2E WINDOWS (Proxmox VM via SSH + PowerShell)
  # NOTE: authored mirroring agent/build-windows-native; validate on first run.
  # ===========================================================================

  e2e-windows-amd64:
    name: E2E Windows amd64
    needs: [resolve]
    # windows-2025, pinned. The first version of this pinned 2022 to match the
    # bench VM byte for byte -- but the point of leaving the bench is to stop
    # being bounded by what it happens to run, and expected-matrix.json (which
    # pins windows-server-amd64 to 2022) is read only by agent's own
    # validate-detection.sh on the bench, never by this leg. 2025 is the current
    # GA Server image; the SCM contract the battery exercises is unchanged.
    # Still pinned rather than windows-latest, which drifts on GitHub's
    # schedule and would change coverage with no diff.
    runs-on: windows-2025
    timeout-minutes: 20
    # The three other VM legs carry this guard; this one did not, so an
    # arm_only dispatch used to acquire a bench VM while vm-cleanup was
    # skipped — a leaked lease, and the bench does not reclaim those
    # implicitly. Harmless now that no VM is taken, kept for consistency.
    if: ${{ github.event.inputs.arm_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-server
    defaults:
      run:
        # Git Bash ships on the Windows runners. The status-reporting steps are
        # shared verbatim with the other legs, so keep one shell for the job and
        # call pwsh explicitly where PowerShell is actually wanted.
        shell: bash
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/windows/amd64","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: agent/go.work

      - name: Build Windows crasher
        run: |
          set -euo pipefail
          # The supervision battery supervises a separate crasher.exe (pure Go,
          # CGO_ENABLED=0); without it supervizio cannot spawn anything and every
          # scenario reports count=0. Built natively now — this runner IS Windows,
          # so the cross-build the bench leg needed is gone.
          ( cd agent/e2e/behavioral/crasher && \
            CGO_ENABLED=0 GOWORK=off go build -ldflags="-s -w" -o "${GITHUB_WORKSPACE}/crasher.exe" . )
          ls -la "${GITHUB_WORKSPACE}/crasher.exe"

      # zot is on the lab network and unreachable from a hosted runner, which is
      # the only reason this leg ever needed the bench. Agent CI mirrors the
      # E2E-consumed binaries to GitHub artifacts, so the same bytes the bench
      # built are fetchable cross-repo.
      - name: Download binary from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-windows-amd64
          path: bin
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify the binary arrived
        run: |
          set -euo pipefail
          ls -la bin/
          # An empty download would otherwise surface as an opaque PowerShell
          # error deep inside the battery; fail where the cause is legible.
          # Absolute: the battery is invoked from pwsh, and a relative path only
          # resolves because pwsh happens to inherit the workspace cwd.
          BIN=$(find "$PWD/bin" -name 'supervizio-windows-amd64*' | head -1)
          [ -n "$BIN" ] && [ -s "$BIN" ] || {
            echo "::error::supervizio-windows-amd64 missing or empty — did agent's CI publish it? (E2E_BRIDGE_PLATFORMS)" >&2
            exit 1
          }
          echo "SVZ_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Supervision scenarios (PowerShell)
        run: |
          set -euo pipefail
          # Ran over SSH against a bench VM before; it runs here directly. The
          # battery is the same file, invoked with the same two arguments.
          # Converted on their own lines, not inline: a failing command
          # substitution inside an argument does NOT trip `set -e`, and
          # scenario-battery.ps1 runs with ErrorActionPreference=Continue, so a
          # missing cygpath would surface as "every scenario count=0" rather
          # than as an error.
          SV_W=$(cygpath -w "$SVZ_BIN")
          CRASHER_W=$(cygpath -w "${GITHUB_WORKSPACE}/crasher.exe")
          pwsh -NoProfile -ExecutionPolicy Bypass -File agent/e2e/scenario-battery.ps1 \
            -Sv "$SV_W" -Crasher "$CRASHER_W"

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"e2e/windows/amd64\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

