name: zz exotic probe (temporary, delete before PR)

on:
  workflow_dispatch:
  push:
    branches: [ci/exotic-linux-e2e]
    paths: [".github/workflows/zz-exotic-probe.yml"]

permissions:
  contents: read

jobs:
  host:
    name: What ubuntu-24.04 registers
    runs-on: ubuntu-24.04
    steps:
      - name: Before
        run: |
          uname -a
          echo "=== binfmt_misc already present ==="
          ls -1 /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo NONE
          echo "=== host cpuinfo ==="
          grep -c '^cpu MHz' /proc/cpuinfo || echo "no cpu MHz line on the host"
      - name: tonistiigi/binfmt --install all
        run: |
          docker run --rm --privileged \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all
      - name: After
        run: ls -1 /proc/sys/fs/binfmt_misc/

  base:
    name: base ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: 386-debian,
              plat: "linux/386",
              img: "debian@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",
            }
          - {
              name: 386-alpine,
              plat: "linux/386",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: armv7-debian,
              plat: "linux/arm/v7",
              img: "debian@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",
            }
          - {
              name: armv7-alpine,
              plat: "linux/arm/v7",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: armv6-alpine,
              plat: "linux/arm/v6",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: riscv64-debian,
              plat: "linux/riscv64",
              img: "debian@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",
            }
          - {
              name: riscv64-alpine,
              plat: "linux/riscv64",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: ppc64le-debian,
              plat: "linux/ppc64le",
              img: "debian@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",
            }
          - {
              name: ppc64le-alpine,
              plat: "linux/ppc64le",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: s390x-debian,
              plat: "linux/s390x",
              img: "debian@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c",
            }
          - {
              name: s390x-alpine,
              plat: "linux/s390x",
              img: "alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0",
            }
          - {
              name: loong64-debian,
              plat: "linux/loong64",
              img: "ghcr.io/loong64/debian@sha256:c57762803d93d8fd71d329e1a7e577bb8ab0b0e3f97a4145f22d8d5c7dabb4d7",
            }
    steps:
      - name: Register emulators
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all \
            > /tmp/binfmt.json
          cat /tmp/binfmt.json

      - name: Boot the base, report what the guest sees
        env:
          PLAT: ${{ matrix.plat }}
          IMG: ${{ matrix.img }}
        run: |
          set -euo pipefail
          docker pull -q --platform "$PLAT" "$IMG"
          docker run --rm --platform "$PLAT" "$IMG" sh -c '
            echo "uname_m=$(uname -m)"
            echo "uname_r=$(uname -r)"
            echo "apk_arch=$(cat /etc/apk/arch 2>/dev/null || echo n/a)"
            echo "dpkg_arch=$(dpkg --print-architecture 2>/dev/null || echo n/a)"
            echo "cpu_mhz_lines=$(grep -c "^cpu MHz" /proc/cpuinfo || true)"
            echo "cpufreq_node=$(ls /sys/devices/system/cpu/cpu0/cpufreq/ 2>/dev/null | tr "\n" "," || echo none)"
            echo "nproc=$(nproc)"
          '

      - name: Time an emulated apt/apk install (cost of the real leg)
        env:
          PLAT: ${{ matrix.plat }}
          IMG: ${{ matrix.img }}
        run: |
          set -euo pipefail
          start=$SECONDS
          if echo "$IMG" | grep -q '^alpine'; then
            docker run --rm --platform "$PLAT" "$IMG" sh -c 'apk add --no-cache jq procps >/dev/null'
          else
            docker run --rm --platform "$PLAT" "$IMG" sh -c 'apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq procps >/dev/null'
          fi
          echo "prep took $((SECONDS-start))s"
