name: validate-release

# =============================================================================
# The public half of a release of supervizio/agent or supervizio/libprobe
# (release-contract/README.md, section 4). The private release job pushes the
# candidate's bytes to its repository's PRIVATE GHCR package, then dispatches
# `validate-release` with the manifest and the artifact's digest. This workflow:
#
#   admit    checks the dispatch against release-contract/policy.json and the
#            artifact the digest names against the manifest -- a layer's digest
#            IS its file's sha256, so no byte is downloaded to do it -- and
#            schedules one leg per required leg (plus the advisory ones).
#   leg/<id> pulls the candidate BY DIGEST, re-hashes every file on arrival and
#            again against the manifest file, and only then runs its scenario.
#   e2e      the legs whose scenario is `e2e` (every agent leg): e2e.yml,
#            called in release mode. Its jobs are `e2e / leg/<id>`; each pulls
#            only the assets it installs plus the test kit, by digest, and runs
#            the same scenario the merge lane runs -- on the release's bytes,
#            with no checkout of the private tree and no secret.
#   verdict  reads this run's leg jobs and says what they imply. It is not the
#            receipt: the private side builds that itself from the completed
#            run (`release_contract.py evidence`), and believes nothing else.
#
# NOTHING BINARY IS STORED IN THIS REPOSITORY. The candidate lives in the private
# package; the legs read it with their own GITHUB_TOKEN, `packages: read`, which
# works only because the package owner granted this repository Read on that one
# package (README section 4 lists them). No job here references a secret: the
# only credentials are the per-job tokens GitHub mints with the permissions
# below. The doorbell that wakes the private side is a separate workflow,
# validate-release-doorbell.yml, so that this one never holds one.
#
# Triggers: repository_dispatch (the private release job) and workflow_dispatch
# (a maintainer, e.g. the proof under tests/proof-policy.json). Never
# pull_request or pull_request_target: a fork's code must not run with a token
# that can read the candidate packages. A receipt can only ever be built from a
# repository_dispatch run on main (`evidence` refuses anything else), so a
# workflow_dispatch run proves the machinery and validates no release.
# =============================================================================

run-name: >-
  ${{ format('validate-release {0} {1} g{2} {3} {4}',
  github.event.client_payload.candidate.repository || fromJSON(inputs.dispatch || '{}').client_payload.candidate.repository,
  github.event.client_payload.candidate.tag || fromJSON(inputs.dispatch || '{}').client_payload.candidate.tag,
  github.event.client_payload.candidate.candidate_generation || fromJSON(inputs.dispatch || '{}').client_payload.candidate.candidate_generation,
  github.event.client_payload.candidate.resolved_commit || fromJSON(inputs.dispatch || '{}').client_payload.candidate.resolved_commit,
  github.event.client_payload.candidate.asset_manifest_digest || fromJSON(inputs.dispatch || '{}').client_payload.candidate.asset_manifest_digest) }}

on:
  repository_dispatch:
    types: [validate-release]
  workflow_dispatch:
    inputs:
      dispatch:
        description: "The full dispatch body: {event_type, client_payload}"
        required: true
        type: string
      policy:
        description: "Policy to judge it under"
        required: true
        type: choice
        default: policy.json
        options:
          - policy.json
          - tests/proof-policy.json
          - tests/e2e-proof-policy.json

permissions: {}

# One run per candidate; a second dispatch of the same one waits instead of
# racing the first for the same verdict.
concurrency:
  group: validate-release-${{ github.event.client_payload.bridge.digest || github.run_id }}
  cancel-in-progress: false

jobs:
  admit:
    name: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # read this run's own title
      packages: read  # read the candidate's OCI manifest -- never its blobs
    outputs:
      legs: ${{ steps.admit.outputs.legs }}
      e2e: ${{ steps.admit.outputs.e2e }}
      dispatch: ${{ steps.admit.outputs.dispatch }}
      policy: ${{ steps.admit.outputs.policy }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same step in every job: the dispatch body, from the event, to a file.
      # Through env, never interpolated into the script -- the payload is text a
      # dispatcher chose.
      - &body
        name: Write the dispatch body
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_BODY: ${{ inputs.dispatch }}
          INPUT_POLICY: ${{ inputs.policy }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          case "$EVENT_NAME" in
            repository_dispatch) policy=policy.json ;;
            workflow_dispatch)
              case "$INPUT_POLICY" in
                policy.json|tests/proof-policy.json|tests/e2e-proof-policy.json) policy="$INPUT_POLICY" ;;
                *) echo "::error::unknown policy '$INPUT_POLICY'"; exit 1 ;;
              esac ;;
            *) echo "::error::validate-release does not run on $EVENT_NAME"; exit 1 ;;
          esac
          "$PY" - <<'PYEOF'
          import json, os
          if os.environ["EVENT_NAME"] == "repository_dispatch":
              body = {"event_type": os.environ["EVENT_ACTION"], "client_payload": json.loads(os.environ["EVENT_PAYLOAD"])}
          else:
              body = json.loads(os.environ["INPUT_BODY"])
          with open("dispatch.json", "w") as fh:
              json.dump(body, fh)
          PYEOF
          {
            echo "PY=$PY"
            echo "POLICY=$policy"
            echo "RC=$PY release-contract/release_contract.py --policy release-contract/$policy"
          } >> "$GITHUB_ENV"

      - name: Admit the dispatch and the candidate it points at
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          $RC dispatch check dispatch.json
          $RC bridge admit --dispatch dispatch.json --run-id "$RUN_ID" --legs-output legs.json --e2e-output e2e.txt
          {
            echo "legs=$(cat legs.json)"
            echo "e2e=$(cat e2e.txt)"
            echo "policy=$POLICY"
            # The body e2e.yml re-reads, compact and on one line. It re-checks
            # it itself (dispatch check, then the pull re-admits the artifact):
            # admit's word is not what a leg runs on.
            echo "dispatch=$("$PY" -c 'import json; print(json.dumps(json.load(open("dispatch.json")), separators=(",", ":")))')"
          } >> "$GITHUB_OUTPUT"

  leg:
    name: leg/${{ matrix.leg.id }}
    needs: [admit]
    # An empty matrix is an error, not a no-op: an agent candidate schedules
    # nothing here, its legs are e2e.yml's.
    if: needs.admit.outputs.legs != '[]'
    runs-on: ${{ matrix.leg.runner }}
    # A BSD guest on an arm64 runner has no KVM: QEMU emulates every instruction
    # and the boot alone can take most of an hour (external-e2e.yml measured
    # 64-122 min for a whole leg there). Everything else fits in 60.
    timeout-minutes: ${{ (contains(fromJSON('["freebsd","openbsd","netbsd"]'), matrix.leg.host) && matrix.leg.runner == 'ubuntu-24.04-arm') && 150 || 60 }}
    # packages: read is the one thing a leg holds, and only the pull step reads
    # it. The scenario step executes candidate bytes with no token in its env.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.admit.outputs.legs) }}
    steps:
      - *checkout
      - *body

      - name: Pull the candidate by digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          $RC bridge pull --dispatch dispatch.json --dir candidate

      # Second, independent check: the files against the manifest FILE, pinned by
      # asset_manifest_digest -- the exact command anyone can re-run on a release.
      # tr -d '\r': Python on the Windows legs ends its lines with CRLF, and a
      # digest with a trailing CR is a digest that never matches (a proof run's
      # windows-amd64 leg refused its own, correct, manifest that way).
      - name: Re-hash every file against the manifest
        shell: bash
        run: |
          set -euo pipefail
          read -r manifest_file digest < <("$PY" -c 'import json; c = json.load(open("dispatch.json"))["client_payload"]["candidate"]; print(c["manifest_file"], c["asset_manifest_digest"])' | tr -d '\r')
          $RC manifest verify-files --manifest "candidate/$manifest_file" --expect-digest "$digest" --dir candidate

      # The scenario in three steps: prepare (host, Python: checks the pulled
      # files and, for a harness, stages it in work/), the harness itself where
      # the leg's platform lives, and check (host, Python: judges what the
      # harness left). A leg without a harness (integrity) is done at prepare.
      # No step from here on holds a token.
      - name: Scenario -- prepare
        shell: bash
        env:
          LEG: ${{ matrix.leg.id }}
        run: |
          set -euo pipefail
          $RC scenario --dispatch dispatch.json --leg "$LEG" --dir candidate --work work --stage prepare

      # --- the libprobe ABI harness (release-contract/harness/libprobe) --------
      # windows-arm64's archive is aarch64-pc-windows-gnullvm, which links with
      # an LLVM mingw toolchain; no hosted image carries one. Pinned release,
      # checked against the digest GitHub publishes for that asset.
      - name: Harness toolchain -- llvm-mingw (windows-arm64)
        if: ${{ matrix.leg.scenario == 'abi' && matrix.leg.platform == 'windows-arm64' }}
        shell: pwsh
        env:
          LLVM_MINGW: llvm-mingw-20260922-ucrt-aarch64
          LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-aarch64.zip
          LLVM_MINGW_SHA256: a317514a7a63badd692032c0c2b8e165f630bbaebbe7a3254348051f43a64949
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW.zip"
          Invoke-WebRequest -Uri $env:LLVM_MINGW_URL -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($got -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw sha256 $got, pinned $env:LLVM_MINGW_SHA256" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Harness -- on the runner
        if: ${{ matrix.leg.scenario == 'abi' && matrix.leg.host == 'native' }}
        shell: bash
        run: sh work/run.sh

      # A guest syncs the whole workspace in and back after every step. The
      # candidate has done its job (work/ holds the one platform the leg runs),
      # and 26 archives over an emulated NIC is what an arm64 guest cannot
      # afford.
      - name: Harness -- keep only work/ for the guest
        if: ${{ matrix.leg.scenario == 'abi' && contains(fromJSON('["freebsd","openbsd","netbsd"]'), matrix.leg.host) }}
        shell: bash
        run: rm -rf candidate

      # Releases pinned, as in external-e2e.yml. The base system's cc is the
      # consumer's compiler; nothing is installed in the guest.
      - name: Harness -- boot FreeBSD 15.1
        if: ${{ matrix.leg.scenario == 'abi' && matrix.leg.host == 'freebsd' }}
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: '15.1'
          arch: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          custom-shell-name: bsdvm
      - name: Harness -- boot OpenBSD 7.9
        if: ${{ matrix.leg.scenario == 'abi' && matrix.leg.host == 'openbsd' }}
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: '7.9'
          arch: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          custom-shell-name: bsdvm
      - name: Harness -- boot NetBSD 10.1
        if: ${{ matrix.leg.scenario == 'abi' && matrix.leg.host == 'netbsd' }}
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1.5.0
        with:
          release: '10.1'
          arch: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          custom-shell-name: bsdvm
      - name: Harness -- in the guest
        if: ${{ matrix.leg.scenario == 'abi' && contains(fromJSON('["freebsd","openbsd","netbsd"]'), matrix.leg.host) }}
        shell: bsdvm {0}
        run: sh work/run.sh

      # Built and run inside the image itself, with that image's libc; scratch
      # is built static in Alpine and run in an image holding only the binary.
      - name: Harness -- in a container
        if: ${{ matrix.leg.scenario == 'abi' && startsWith(matrix.leg.host, 'container-') }}
        shell: bash
        env:
          HOST: ${{ matrix.leg.host }}
        run: |
          set -euo pipefail
          case "$HOST" in
            container-ubuntu)
              docker run --rm -v "$PWD/work:/work" ubuntu:24.04 sh -c \
                'apt-get update -qq && apt-get install -y -qq gcc libc6-dev >/dev/null && sh /work/run.sh' ;;
            container-alpine)
              docker run --rm -v "$PWD/work:/work" alpine:3.21 sh -c \
                'apk add --no-cache -q gcc musl-dev && sh /work/run.sh' ;;
            container-scratch)
              docker run --rm -v "$PWD/work:/work" alpine:3.21 sh -c \
                'apk add --no-cache -q gcc musl-dev && sh /work/run.sh build'
              printf 'FROM scratch\nCOPY consumer /consumer\nENTRYPOINT ["/consumer"]\n' > work/Dockerfile.scratch
              docker build -q -f work/Dockerfile.scratch -t libprobe-abi-scratch work >/dev/null
              version="$(sed -n 's/^EXPECTED_VERSION=//p' work/plan.env)"
              docker run --rm -v "$PWD/work:/out" libprobe-abi-scratch "$version" /out/report.json ;;
            *) echo "::error::no container recipe for $HOST"; exit 1 ;;
          esac

      - name: Scenario -- check
        shell: bash
        env:
          LEG: ${{ matrix.leg.id }}
        run: |
          set -euo pipefail
          $RC scenario --dispatch dispatch.json --leg "$LEG" --dir candidate --work work --stage check

  # The agent legs: e2e.yml's jobs, in release mode. No `secrets:` -- not
  # inherit, not one: the called workflow sees every secret empty, which is
  # what lets it execute candidate bytes. Its permissions cannot exceed these.
  e2e:
    name: e2e
    needs: [admit]
    if: needs.admit.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      mode: release
      dispatch: ${{ needs.admit.outputs.dispatch }}
      policy: ${{ needs.admit.outputs.policy }}

  verdict:
    name: verdict
    needs: [admit, leg, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # this run's jobs
    steps:
      - *checkout
      - *body
      - name: What the legs imply
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          $RC judge --dispatch dispatch.json --run-id "$RUN_ID" --summary "$GITHUB_STEP_SUMMARY"
