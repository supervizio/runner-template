          name: supervizio-openbsd-pkg
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Verify the package arrived
        run: |
          set -euo pipefail
          ls -la pkg/
          TGZ=$(find pkg -name '*.tgz' | head -1)
          [ -n "$TGZ" ] && [ -s "$TGZ" ] || {
            echo "::error::no OpenBSD .tgz - did agent's native-openbsd job publish supervizio-openbsd-pkg?" >&2
            exit 1
          }
          # Keep the packager's own filename. OpenBSD's pkg_add resolves its
          # argument as <stem>-<version>, so supervizio-openbsd.tgz reads as
          # stem "supervizio" / version "openbsd" -- not a version, so pkg_add
          # stops treating it as a file and searches PKG_PATH instead:
          #
          #   file:/tmp/: empty
          #   Can't find supervizio-openbsd.tgz
          #
          # measured twice, runs 35436578877 and 35437716922. build-pkg.sh
          # already emits a conforming supervizio-<version>.tgz; renaming it
          # here was what broke it.
          OPENBSD_PKG="$TGZ"
