# Exercises .github/actions/qemu-vm against the upstream cloud images that would
# back the remaining e2e-vm legs, BEFORE anything in e2e.yml depends on it.
#
# The mechanism is measured (Debian 13 and Alpine both boot to a usable SSH
# shell in 22-33s under nested KVM, with PID 1 verified and the service manager
# proven live). What is NOT yet proven is this action's wiring on a real hosted
# runner, which is what this workflow establishes.
#
# Each leg asserts the thing that actually matters for a supervisor under test:
# that PID 1 is the expected init and that its service manager answers.
name: QEMU VM self-test

on:
  workflow_dispatch:
  # workflow_dispatch alone made this unrunnable: dispatching requires the file
  # to exist on the DEFAULT branch, so a self-test that only lives on a feature
  # branch can never be triggered — and this one never had a single run.
  #
  # Scoped to its own two files, so it fires when the action or the test changes
  # and stays silent otherwise. Cheap on a public repo, and it can live here
  # permanently instead of being added and reverted around each attempt.
  push:
    paths:
      - '.github/workflows/qemu-vm-selftest.yml'
      - '.github/actions/qemu-vm/action.yml'

permissions:
  contents: read

jobs:
  selftest:
    name: qemu ${{ matrix.name }} on ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # BOTH host images, on purpose. ubuntu-latest migrates to 26.04 between
        # 19 Oct and 19 Nov 2026, so this repo moves either way -- the only
        # choice is whether it moves on evidence or on GitHub's calendar.
        #
        # 26.04 had exactly one real blocker: it enforces a disk quota on /tmp,
        # and the vmactions actions cached their guest image there (EDQUOT,
        # vmactions/freebsd-vm#148). The pins in e2e.yml are now past that fix,
        # so the blocker is gone. KVM itself is present and usable on 26.04
        # x86_64, and this action writes to $RUNNER_TEMP rather than /tmp, so it
        # should be unaffected -- "should" being exactly what this matrix is
        # here to replace with a result.
        host: [ubuntu-24.04, ubuntu-26.04]
        # `guest` must be a real dimension. With only `host` as a dimension and
        # the guests supplied purely through `include`, GitHub merges EVERY
        # include entry into EVERY existing combination, so each one overwrites
        # the last and only the final entry survives: run 35400147725 produced
        # 2 jobs, both opensuse, instead of 8. The includes below now attach
        # per-guest fields to an existing host x guest combination rather than
        # trying to create one.
        guest: [alpine-openrc, debian-systemd, fedora-systemd, opensuse-systemd]
        include:
          # The four legs whose init ships in a STOCK upstream cloud image, so
          # no guest-side package install is needed. alpine-s6, alpine-runit and
          # debian-sysvinit each need an extra package, and artix has no cloud
          # image at all -- those are a separate problem, deliberately not here.
          # generic_, not nocloud_: Alpine publishes generic_ for every point
          # release but nocloud_ only for some (3.23.5 nocloud_ is a 404), so a
          # nocloud_ pin breaks on a routine version bump for no visible reason.
          - guest: alpine-openrc
            name: alpine-openrc
            init: init
            probe: "rc-status -s >/dev/null && echo openrc-ok"
            url: https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/generic_alpine-3.23.5-x86_64-bios-cloudinit-r0.qcow2
            sha512: a4c1c301b2972e805df318a0b1f5effb3db7106932ecedc0222456aefe18453b5126ebee3f550db5ef9000c644f79a4394c6d3a8906d0ceb05350593e9c4a1c7
            sha256: ""
          # genericcloud, not generic: virtio-only, 88 MiB smaller, boots
          # identically under -machine q35. And a DATED path, not latest/:
          # latest/ rolls and would silently invalidate the checksum below.
          - guest: debian-systemd
            name: debian-systemd
            init: systemd
            probe: "systemctl is-system-running || true"
            url: https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-genericcloud-amd64-20260914-2601.qcow2
            sha512: 95e110dfcdbd0ed8a82a75ed9579802f9950cabf51a810dcc6388e81bc778188713878b9f28d583a0ea602fbf48b35996ae9ad37f584166d8fbd6489df248f53
            sha256: ""
          - guest: fedora-systemd
            name: fedora-systemd
            init: systemd
            probe: "systemctl is-system-running || true"
            url: https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            sha512: ""
            sha256: 846574c8a97cd2d8dc1f231062d73107cc85cbbbda56335e264a46e3a6c8ab2f
          - guest: opensuse-systemd
            name: opensuse-systemd
            init: systemd
            probe: "systemctl is-system-running || true"
            url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
            sha512: ""
            sha256: c5cd6904632c86d5368dea3896da8c17571c238ef96a0e2c8b0ca1835d796e07
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare a file to push into the guest
        run: echo "pushed-by-selftest" > payload.txt

      - name: Boot ${{ matrix.name }} and assert its init
        uses: ./.github/actions/qemu-vm
        env:
          # Through env, not interpolated into the guest script: the action
          # itself passes `run` via env for exactly this reason, and doing it
          # here too keeps the property end to end.
          EXPECTED_INIT: ${{ matrix.init }}
          LEG_NAME: ${{ matrix.name }}
          MANAGER_PROBE: ${{ matrix.probe }}
        with:
          # `env:` above reaches the HOST only. ssh forwards no environment, so
          # without naming them here the guest saw EXPECTED_INIT='' and every
          # leg failed "PID 1 is 'systemd', expected ''" -- run 35400445441,
          # eight legs, one cause.
          envs: EXPECTED_INIT LEG_NAME MANAGER_PROBE
          image-url: ${{ matrix.url }}
          # Every image is checksum-pinned, each from its own upstream published
          # file -- Debian and Alpine publish sha512 only, Fedora and openSUSE
          # sha256. The URLs redirect to arbitrary mirrors (Debian landed on a
          # Swedish one when checked), and the guest gets a root shell, so an
          # unverified blob is not acceptable here.
          image-sha256: ${{ matrix.sha256 }}
          image-sha512: ${{ matrix.sha512 }}
          memory: "2048"
          # Exercises the `files` path, which nothing else here would.
          files: |
            payload.txt:/tmp/payload.txt
          run: |
            echo "=== uname ==="; uname -srm
            # Guards against a silent TCG fallback. Measured: a KVM guest
            # reaches a shell in 22-45s, the same guest under TCG in 80-240s.
            # If /dev/kvm ever stops being usable on a host image, the legs do
            # not fail -- they just get ~23x slower, which is the kind of
            # regression nobody notices until a bill or a timeout arrives.
            UP=$(cut -d. -f1 /proc/uptime)
            echo "guest uptime at first command: ${UP}s"
            [ "$UP" -lt 70 ] || echo "::warning::guest took ${UP}s to reach this point - KVM may not be active on ${{ matrix.host }}"
            echo "=== PID 1 ==="
            # /proc/1/comm, NOT `ps -p 1 -o comm=`: BusyBox ps has no -p
            # ("ps: unrecognized option: p") and procps is not installed on the
            # stock Alpine cloud image, so that probe fails there every time --
            # and piping it to `tr` swallowed the status, leaving an empty
            # value and an assertion that could never pass.
            pid1=$(cat /proc/1/comm)
            echo "comm=$pid1  exe=$(readlink -f /proc/1/exe 2>/dev/null || echo '?')"
            # The assertion the whole migration rests on: a REAL init, not a
            # container entrypoint pretending to be one.
            [ "$pid1" = "$EXPECTED_INIT" ] || {
              echo "::error::PID 1 is '$pid1', expected '$EXPECTED_INIT'"
              exit 1
            }
            echo "=== file push ==="
            grep -qx 'pushed-by-selftest' /tmp/payload.txt || {
              echo "::error::files: payload did not arrive intact"; exit 1; }
            echo "=== service manager ==="
            sh -c "$MANAGER_PROBE"
            echo "OK $LEG_NAME: real init, manager answering, file push works"
