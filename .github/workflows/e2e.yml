            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            echo "=== Verify the service grafted onto systemd ==="
            systemctl is-enabled supervizio >/dev/null 2>&1 || { echo "::error::not enabled under systemd"; systemctl status supervizio || true; exit 1; }
            echo "OK: systemd has supervizio enabled"

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh" /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            echo "=== Uninstall ==="
            # No tty here: uninstall.sh's config-dir prompt would either take EOF
            # and trip `set -e`, or block until the job timeout.
            SUPERVIZIO_NON_INTERACTIVE=true; export SUPERVIZIO_NON_INTERACTIVE
            sh "$WS/setup/uninstall.sh"
            [ -x /usr/local/bin/supervizio ] && echo "::warning::binary still present after uninstall" || true

      - name: Report status (result)
        if: always() && needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          STATE="success"; DESC="Passed"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; DESC="Failed"; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
