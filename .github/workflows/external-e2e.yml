name: External E2E (dispatched)

# =============================================================================
# Runs another (PRIVATE) repo's E2E on this PUBLIC repo's FREE, unlimited
# GitHub-hosted runners (native linux/windows/macos amd64+arm64 + BSD via QEMU,
# both amd64 AND arm64). Triggered ONLY by an authenticated repository_dispatch
# — never by a PR — so external forks can never reach the secrets below.
#
# NO SOURCE COMES HERE. The source repository cross-builds every leg's test
# executables in its own CI and uploads them to its run (`e2e-tests-<leg>`,
# one day); each leg downloads its bundle from that run (source_run_id) and
# runs its plan with .github/scripts/libprobe-e2e-plan.sh, which refuses a
# bundle holding anything but executables and a plan.
#
# Besides pass/fail, every leg emits a `metrics_report` JSON — the REAL value of
# every metric collected on that (os, arch) — uploaded as an artifact. Those
# artifacts are the ground truth from which the coverage plaquette is
# regenerated (no hand-authored assessment). They contain only ephemeral
# CI-runner / QEMU-VM system metrics — no secrets.
#
# THE VERDICT (commit status e2e-public/<run>-<attempt> on the source SHA) is
# success iff all 9 GATING legs passed:
#   * the 6 native legs -- linux, windows, macos x amd64, arm64;
#   * the 3 BSD amd64 legs -- freebsd, openbsd, netbsd (QEMU with KVM, 4-7 min).
# ADVISORY, shown in the report table and never in the verdict:
#   * the 3 BSD arm64 legs (QEMU without KVM, 1-2 h each: gating on them would
#     hold every libprobe merge for hours);
#   * the 3 container legs.
#
# SECURITY MODEL (public executor of private code — critical surface):
#   * repository_dispatch-only trigger; no pull_request / pull_request_target.
#   * No personal token. Each job that reads libprobe or posts its status runs
#     in the `private-source` environment (deployment branches: main only) and
#     mints a kodflow-ci GitHub App token there (vars.CI_APP_CLIENT_ID, secret
#     CI_APP_PRIVATE_KEY, both environment-scoped) for supervizio/libprobe
#     alone, actions: read (the bundle) + statuses: write, revoked when the
#     job ends. Posts the result back as a commit status on the source commit.
#   * Pass/fail travels via that commit status; the metric reports travel via
#     one-day artifacts (non-sensitive, see above).
#   * Logs minimized (no --nocapture, RUST_BACKTRACE=0). The run is DELETED by
#     cleanup-external-e2e.yml AFTER the dispatcher has pulled the artifacts.
#   * Third-party actions pinned by commit SHA.
# =============================================================================

on:
  repository_dispatch:
    types: [run-external-e2e]
  # Manual trigger for validating this workflow on a feature branch BEFORE it is
  # merged to the default branch (repository_dispatch always runs the default
  # branch's copy). Inputs mirror the dispatch client_payload.
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo (e.g. supervizio/libprobe)"
        required: true
      source_sha:
        description: "Source commit SHA to check out"
        required: true
      source_run_id:
        description: "Source run id: the run whose e2e-tests-* bundles the legs download (and the status context)"
        required: true
      source_attempt:
        description: "Source run attempt"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: external-e2e-${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}-${{ github.event.client_payload.source_run_id || github.event.inputs.source_run_id }}
  cancel-in-progress: true

env:
  SOURCE_REPO: ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo }}
  SOURCE_SHA: ${{ github.event.client_payload.source_sha || github.event.inputs.source_sha }}
  SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id || github.event.inputs.source_run_id }}
  SOURCE_ATTEMPT: ${{ github.event.client_payload.source_attempt || github.event.inputs.source_attempt }}
  CHECK_NAME: e2e-public/${{ github.event.client_payload.source_run_id || github.event.inputs.source_run_id }}-${{ github.event.client_payload.source_attempt || github.event.inputs.source_attempt }}
  RUST_BACKTRACE: "0"
  # The bundle's plan: every test executable with --include-ignored (the
  # #[ignore]-gated E2E ones too), each run whatever the previous one
  # concluded, so a red leg lists every failing executable; then
  # metrics_report. The plan runner is this repository's.
  PLAN: .github/scripts/libprobe-e2e-plan.sh

jobs:
  # --- Ack: set the pending commit status immediately, so the source repo's
  # collect job knows the dispatch was received (even if the matrix later dies).
  ack:
    name: Ack (pending status)
    runs-on: ubuntu-26.04
    environment: private-source
    steps:
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-actions: read
          permission-statuses: write

      # Gate the whole workflow on source_repo, BEFORE anything reads it.
      #
      # SOURCE_REPO comes straight from an attacker-controllable dispatch
      # payload, and every downstream job downloads executables from that
      # repository's run with a libprobe App token and runs them. An
      # unconstrained value turns "can dispatch a test run" into "can run
      # arbitrary code next to a private-repo credential".
      #
      # Every other job declares `needs: [ack]`, so failing here stops the run
      # before a single download happens. libprobe only: the token reaches
      # nothing else, and agent has its own lane in e2e.yml.
      #
      # Read through env rather than template interpolation -- a repository name is
      # attacker-supplied text and would otherwise be pasted verbatim into the
      # shell.
      - name: Validate source repository
        env:
          CANDIDATE: ${{ env.SOURCE_REPO }}
        run: |
          set -euo pipefail
          case "$CANDIDATE" in
            supervizio/libprobe) ;;
            *)
              echo "::error::refusing source_repo '$CANDIDATE' - external-e2e.yml serves supervizio/libprobe only" >&2
              exit 1 ;;
          esac
          echo "source_repo accepted: $CANDIDATE"
          # The legs download their bundles from this run of the source repo.
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "::error::source_run_id '$SOURCE_RUN_ID' is not a run id" >&2; exit 1 ;;
          esac

      - name: Set pending commit status on source
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${SOURCE_REPO}/statuses/${SOURCE_SHA}" \
            -f state="pending" \
            -f context="${CHECK_NAME}" \
            -f description="Dispatched from run ${SOURCE_RUN_ID}.${SOURCE_ATTEMPT}; matrix running." >/dev/null
          echo "pending status set"

  # --- Native legs: gating. Run the full suite, then emit the real metrics
  # report for this (os, arch) and upload it. Free hosted runners honor
  # rust-toolchain.toml via preinstalled rustup.
  native:
    name: e2e ${{ matrix.platform }}
    needs: [ack]
    runs-on: ${{ matrix.runner }}
    environment: private-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64,   runner: ubuntu-26.04 }
          - { platform: linux-arm64,   runner: ubuntu-26.04-arm }
          - { platform: windows-amd64, runner: windows-latest }
          - { platform: windows-arm64, runner: windows-11-arm }
          - { platform: macos-amd64,   runner: macos-26-intel }
          - { platform: macos-arm64,   runner: macos-26 }
    steps:
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-actions: read
          permission-statuses: write

      # This repository's plan runner, nothing of libprobe's. Before the
      # download: checkout empties the workspace.
      - name: Plan runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/libprobe-e2e-plan.sh
      - name: Download the test bundle (binaries and a plan, no source)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUNDLE: e2e-tests-${{ matrix.platform }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" -R "$SOURCE_REPO" -n "$BUNDLE" -D bundle
          sh "$PLAN" check bundle
      - name: Full test suite
        shell: bash
        run: sh "$PLAN" tests bundle
      - name: Generate metrics report (real ground-truth artifact)
        if: ${{ always() }}
        shell: bash
        run: sh "$PLAN" report bundle "report-${{ matrix.platform }}.json"
      - name: Upload metrics report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ matrix.platform }}
          path: report-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 1

  # --- BSD legs via QEMU (vmactions): one job per (os, arch) -------------------
  #
  # amd64 GATES, arm64 does not. The amd64 guests get /dev/kvm on the x86_64
  # runner and a whole leg takes 4-7 min. The arm64 runner exposes no KVM, so QEMU
  # emulates every instruction and a leg takes 64-122 min: gating on it would
  # hold every libprobe merge for hours. arm64 stays advisory -- red when it
  # fails, shown in the report table, outside the verdict.
  #
  # One job per (os, arch), not a matrix over the arch, because `needs:`
  # attaches to a JOB and never to one leg of its matrix: with the arch as a
  # matrix, `report` could only gate on amd64 by also waiting for the arm64 leg
  # of the same job. Separate jobs let `report` need the amd64 legs and nothing
  # slower.
  #
  # The steps are written once, under the &bsd-leg anchor, and every BSD job
  # aliases them; a job only sets LEG_OS / LEG_ARCH / VM_ARCH / BOOT_TIMEOUT_MIN.
  # `uses:` takes no expression, so the three vmactions boots are listed and the
  # two for the other OSes are skipped. `custom-shell-name: bsdvm` gives the
  # three guests one shell name, so the test and report steps exist once.
  #
  # BOOTSTRAP vs VERDICT. Everything before `Bootstrap complete` -- the plan
  # runner, the bundle download, the VM boot -- is infrastructure: no libprobe
  # code has run yet, so a failure there says nothing about the code.
  # Everything after it -- tests, metrics report -- is the verdict.
  #
  # RETRY: amd64 only, bootstrap only. A gating leg whose attempt 1 never got
  # past bootstrap (no `bootstrapped` output) runs once more as <os>-amd64-retry,
  # on a fresh runner with a fresh VM. A leg that reached its tests is never
  # retried: a failing assertion is an answer, and asking twice would turn a
  # real regression into a coin toss. `report` takes the retry's result exactly
  # when attempt 1 did not bootstrap. arm64 is not retried: it gates nothing,
  # and a second attempt can cost two more hours.
  #
  # The custom shell rsyncs the workspace back to the host after every step:
  # that is how the report JSON reaches the upload.
  freebsd-amd64:
    name: e2e freebsd-amd64
    needs: [ack]
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: &freebsd-amd64
      LEG_OS: freebsd
      LEG_ARCH: amd64
      VM_ARCH: x86_64
      BOOT_TIMEOUT_MIN: "15"
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: &bsd-leg
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-actions: read
          permission-statuses: write

      # This repository's plan runner and the leg's bundle, both on the host
      # before the boot: the workspace is synced into the guest.
      - name: Plan runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/libprobe-e2e-plan.sh
      - name: Download the test bundle (binaries and a plan, no source)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUNDLE: e2e-tests-${{ env.LEG_OS }}-${{ env.LEG_ARCH }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" -R "$SOURCE_REPO" -n "$BUNDLE" -D bundle
          sh "$PLAN" check bundle

      # Releases pinned, like e2e.yml. Unpinned, the action follows its own
      # default, which moves without notice -- netbsd already drifted to 11.0
      # while the bench and expected-matrix.json still said 10.1. A guest that
      # changes under you turns a red leg into a mystery.
      - name: Boot FreeBSD 15.1 ${{ env.LEG_ARCH }}
        id: boot-freebsd
        if: ${{ env.LEG_OS == 'freebsd' }}
        timeout-minutes: ${{ fromJSON(env.BOOT_TIMEOUT_MIN) }}
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: '15.1'
          arch: ${{ env.VM_ARCH }}
          custom-shell-name: bsdvm
          run: uname -a
      - name: Boot OpenBSD 7.9 ${{ env.LEG_ARCH }}
        id: boot-openbsd
        if: ${{ env.LEG_OS == 'openbsd' }}
        timeout-minutes: ${{ fromJSON(env.BOOT_TIMEOUT_MIN) }}
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: '7.9'
          arch: ${{ env.VM_ARCH }}
          custom-shell-name: bsdvm
          run: uname -a
      - name: Boot NetBSD 10.1 ${{ env.LEG_ARCH }}
        id: boot-netbsd
        if: ${{ env.LEG_OS == 'netbsd' }}
        timeout-minutes: ${{ fromJSON(env.BOOT_TIMEOUT_MIN) }}
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1.5.0
        with:
          release: '10.1'
          arch: ${{ env.VM_ARCH }}
          custom-shell-name: bsdvm
          run: uname -a

      # The boundary. Set only when one of the three boots succeeded, so a job
      # whose LEG_OS matches none of them cannot pass for bootstrapped.
      - name: Bootstrap complete -- every failure from here on is the code's
        id: bootstrapped
        if: ${{ steps.boot-freebsd.outcome == 'success' || steps.boot-openbsd.outcome == 'success' || steps.boot-netbsd.outcome == 'success' }}
        run: echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
      - name: VM never became ready (infrastructure, not a test result)
        if: ${{ !cancelled() && steps.bootstrapped.outcome != 'success' }}
        run: |
          echo "::error::${LEG_OS}-${LEG_ARCH}: the guest never became ready to test (bundle download or VM boot failed) -- no libprobe code ran. Attempt 1 of an amd64 leg is retried once on a fresh runner; a retry that fails too, or an arm64 leg, stays failed."
          exit 1

      - name: Full test suite
        if: ${{ steps.bootstrapped.outcome == 'success' }}
        shell: bsdvm {0}
        # Expression, not $PLAN: the guest shell does not inherit the job's env.
        run: sh ${{ env.PLAN }} tests bundle
      # Whatever the tests concluded, as long as the guest is up: a red leg
      # still owes its ground-truth report.
      - name: Generate metrics report (real ground-truth artifact)
        if: ${{ !cancelled() && steps.bootstrapped.outcome == 'success' }}
        shell: bsdvm {0}
        run: sh ${{ env.PLAN }} report bundle report-${{ env.LEG_OS }}-${{ env.LEG_ARCH }}.json
      - name: Upload metrics report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ env.LEG_OS }}-${{ env.LEG_ARCH }}
          path: report-${{ env.LEG_OS }}-${{ env.LEG_ARCH }}.json
          if-no-files-found: warn
          retention-days: 1
          # A retry runs only when attempt 1 never reached the report, so the
          # two never both upload. Were they ever to, the retry's is the leg's.
          overwrite: true

  freebsd-amd64-retry:
    name: e2e freebsd-amd64 (retry)
    needs: [ack, freebsd-amd64]
    if: ${{ !cancelled() && needs.ack.result == 'success' && needs.freebsd-amd64.outputs.bootstrapped != 'true' }}
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: *freebsd-amd64
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: *bsd-leg

  openbsd-amd64:
    name: e2e openbsd-amd64
    needs: [ack]
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: &openbsd-amd64
      LEG_OS: openbsd
      LEG_ARCH: amd64
      VM_ARCH: x86_64
      BOOT_TIMEOUT_MIN: "15"
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: *bsd-leg

  openbsd-amd64-retry:
    name: e2e openbsd-amd64 (retry)
    needs: [ack, openbsd-amd64]
    if: ${{ !cancelled() && needs.ack.result == 'success' && needs.openbsd-amd64.outputs.bootstrapped != 'true' }}
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: *openbsd-amd64
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: *bsd-leg

  netbsd-amd64:
    name: e2e netbsd-amd64
    needs: [ack]
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: &netbsd-amd64
      LEG_OS: netbsd
      LEG_ARCH: amd64
      VM_ARCH: x86_64
      BOOT_TIMEOUT_MIN: "15"
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: *bsd-leg

  netbsd-amd64-retry:
    name: e2e netbsd-amd64 (retry)
    needs: [ack, netbsd-amd64]
    if: ${{ !cancelled() && needs.ack.result == 'success' && needs.netbsd-amd64.outputs.bootstrapped != 'true' }}
    runs-on: ubuntu-26.04
    environment: private-source
    timeout-minutes: 40
    env: *netbsd-amd64
    outputs:
      bootstrapped: ${{ steps.bootstrapped.outputs.bootstrapped }}
    steps: *bsd-leg

  # arm64: advisory. `continue-on-error` keeps a red leg from failing the run;
  # none of these is in report's `needs`, so none can move the verdict. No job
  # timeout either, as before: a slow emulated leg is still a result.
  freebsd-arm64:
    name: e2e freebsd-arm64
    needs: [ack]
    runs-on: ubuntu-26.04-arm
    environment: private-source
    continue-on-error: true
    env:
      LEG_OS: freebsd
      LEG_ARCH: arm64
      VM_ARCH: aarch64
      BOOT_TIMEOUT_MIN: "60"
    steps: *bsd-leg

  openbsd-arm64:
    name: e2e openbsd-arm64
    needs: [ack]
    runs-on: ubuntu-26.04-arm
    environment: private-source
    continue-on-error: true
    env:
      LEG_OS: openbsd
      LEG_ARCH: arm64
      VM_ARCH: aarch64
      BOOT_TIMEOUT_MIN: "60"
    steps: *bsd-leg

  # If vmactions ever ships no NetBSD/aarch64 image, this leg fails at
  # bootstrap and only the amd64 report is produced -- nothing else changes.
  netbsd-arm64:
    name: e2e netbsd-arm64
    needs: [ack]
    runs-on: ubuntu-26.04-arm
    environment: private-source
    continue-on-error: true
    env:
      LEG_OS: netbsd
      LEG_ARCH: arm64
      VM_ARCH: aarch64
      BOOT_TIMEOUT_MIN: "60"
    steps: *bsd-leg

  # --- Container legs: the same metrics are ALSO collected INSIDE Docker
  # containers (musl/glibc/scratch), so the report certifies what libprobe
  # captures under each libc + a no-OS image. metrics_report comes from the
  # source repo's bundle for the matching libc (gnu: linux-amd64, static musl:
  # linux-amd64-musl), runs inside the image; its JSON is extracted. Advisory.
  containers:
    name: e2e container-${{ matrix.distro }}
    needs: [ack]
    runs-on: ubuntu-26.04
    environment: private-source
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu,  image: "ubuntu:24.04", bundle: linux-amd64 }
          - { distro: alpine,  image: "alpine:3.21",  bundle: linux-amd64-musl }
          - { distro: scratch, image: "scratch",      bundle: linux-amd64-musl }
    steps:
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-actions: read
          permission-statuses: write

      - name: Plan runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/libprobe-e2e-plan.sh
      - name: Download metrics_report (binaries and a plan, no source)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUNDLE: e2e-tests-${{ matrix.bundle }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" -R "$SOURCE_REPO" -n "$BUNDLE" -D bundle
          sh "$PLAN" check bundle
      - name: Run metrics_report inside ${{ matrix.image }}
        run: |
          set -euo pipefail
          bin="bundle/bin/metrics_report"
          out="report-container-${{ matrix.distro }}.json"
          if [ "${{ matrix.distro }}" = "scratch" ]; then
            cp "$bin" mr
            printf 'FROM scratch\nCOPY mr /metrics_report\nENTRYPOINT ["/metrics_report"]\n' > Dockerfile.mr
            docker build -q -f Dockerfile.mr -t mr-scratch . >/dev/null
            docker run --rm mr-scratch > "$out"
          else
            docker run --rm -v "$PWD/$bin:/metrics_report:ro" ${{ matrix.image }} /metrics_report > "$out"
          fi
          echo "$(wc -c <"$out") bytes"; head -c 200 "$out"
      - name: Upload container report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-container-${{ matrix.distro }}
          path: report-container-${{ matrix.distro }}.json
          if-no-files-found: warn
          retention-days: 1

  # --- Collect: fuse every per-(os,arch) report into one `metrics-reports`
  # artifact the dispatcher downloads to regenerate the coverage plaquette.
  collect-reports:
    name: Collect metric reports
    needs: [native, freebsd-amd64, freebsd-amd64-retry, freebsd-arm64, openbsd-amd64, openbsd-amd64-retry, openbsd-arm64, netbsd-amd64, netbsd-amd64-retry, netbsd-arm64, containers]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Download all per-leg reports
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summarize
        run: |
          set -euo pipefail
          echo "Collected reports:"; ls -la reports/ || true
          n=$(find reports -name '*.json' 2>/dev/null | wc -l)
          echo "report count: ${n}"
      - name: Bundle metrics-reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 1

  # --- Report: set the final source commit status ------------------------------
  # Needs exactly the gating legs: the native matrix, and the three BSD amd64
  # legs with their retries. It never waits on arm64 (1-2 h): the source repo
  # polls this status against a deadline, and nothing arm64 could report would
  # change the verdict. Advisory rows show whatever conclusion exists when the
  # report runs -- for arm64, usually "not finished".
  #
  # Two sources, each used for what it can be trusted with:
  #   * `needs` for the BSD amd64 verdicts. None of those jobs uses
  #     continue-on-error, so their `result` is the real one, and `needs` carries
  #     the `bootstrapped` output that picks attempt 1 or the retry.
  #   * the jobs API for rows inside a matrix (`needs.native` is one aggregate)
  #     and for the advisory legs, which are deliberately not in `needs` at all.
  # The native matrix is read both ways: every leg `success` in the jobs API AND
  # `needs.native.result == success`.
  report:
    name: Report → source status
    needs: [ack, native, freebsd-amd64, freebsd-amd64-retry, openbsd-amd64, openbsd-amd64-retry, netbsd-amd64, netbsd-amd64-retry]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    environment: private-source
    permissions:
      contents: read
      actions: read
    steps:
      # A kodflow-ci App token for supervizio/libprobe alone, minted here because
      # this job runs in the private-source environment (the only place the
      # App's key can be read), revoked when the job ends.
      - name: Token for supervizio/libprobe (kodflow-ci App)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: supervizio
          repositories: libprobe
          permission-statuses: write

      - name: Aggregate + set final commit status
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RT_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # This run's job conclusions (own repo -> RT_TOKEN / github.token).
          jobs=$(GH_TOKEN="$RT_TOKEN" gh api --paginate \
                   "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
                   --jq '.jobs[] | select(.name|startswith("e2e ")) | "\(.name|ltrimstr("e2e "))|\(.conclusion)"')
          conclusion() {
            c=$(printf '%s\n' "$jobs" | awk -F'|' -v p="$1" '$1==p{print $2; exit}')
            case "$c" in ""|null) echo "not finished" ;; *) echo "$c" ;; esac
          }
          result()       { jq -r --arg j "$1" '.[$j].result // "missing"' <<<"$NEEDS_JSON"; }
          bootstrapped() { jq -r --arg j "$1" '.[$j].outputs.bootstrapped // ""' <<<"$NEEDS_JSON"; }

          table=""; gating=0; fails=0
          row() { table="${table}| $1 | $2 | $3 |"$'\n'; }

          for leg in linux-amd64 linux-arm64 windows-amd64 windows-arm64 macos-amd64 macos-arm64; do
            c=$(conclusion "$leg"); gating=$((gating+1))
            row "$leg" "$c" "gating"
            [ "$c" = success ] || fails=$((fails+1))
          done
          native=$(result native)

          for leg in freebsd-amd64 openbsd-amd64 netbsd-amd64; do
            gating=$((gating+1))
            if [ "$(bootstrapped "$leg")" = true ]; then
              c=$(result "$leg"); how="gating"
            else
              c=$(result "$leg-retry"); how="gating, retried: attempt 1 ($(result "$leg")) never had a ready guest"
            fi
            row "$leg" "$c" "$how"
            [ "$c" = success ] || fails=$((fails+1))
          done

          for leg in freebsd-arm64 openbsd-arm64 netbsd-arm64 container-ubuntu container-alpine container-scratch; do
            row "$leg" "$(conclusion "$leg")" "advisory"
          done

          if [ "$fails" -eq 0 ] && [ "$native" = success ]; then overall=success; else overall=failure; fi
          summary="e2e: ${overall} -- ${fails} of ${gating} gating legs failing (native matrix: ${native})"
          {
            echo "## ${summary}"
            echo
            echo "${SOURCE_REPO}@${SOURCE_SHA}"
            echo
            echo "| leg | conclusion | role |"
            echo "|---|---|---|"
            printf '%s' "$table"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Commit Status API: the App token carries statuses: write, and no
          # checks permission, so a status and not a check-run.
          gh api -X POST "repos/${SOURCE_REPO}/statuses/${SOURCE_SHA}" \
            -f state="${overall}" \
            -f context="${CHECK_NAME}" \
            -f description="${summary}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "status set: ${overall}"
