  # ===========================================================================
  # E2E VM TESTS (Proxmox, self-hosted)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # The last two legs to leave the Proxmox bench. Both were measured green in
  # bench-leg-substrates-proof.yml before this wiring existed; see that file for
  # the traps already paid for.
  #
  # The commit status contexts stay `e2e/vm/<name>`, as the other migrated Linux
  # legs kept theirs. They are informational on the agent side, and renaming
  # them would strand history for nothing.
  # ---------------------------------------------------------------------------
  e2e-linux-artix-dinit:
    name: E2E Linux artix-dinit
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event.inputs.arm_only != 'true' }}
    env:
      # A TAG of artixlinux/artixlinux. `artixlinux/base-dinit` is a 404.
      # Pinned by digest: this container gets a root shell and installs our
      # package.
      ARTIX: artixlinux/artixlinux@sha256:874c6127fd51fec8455274f7a4b22b04ecd5db35886677f3e780339f71f20a9b
    steps:
      - name: Report status (pending)
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && exit 0
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ needs.resolve.outputs.source_repo }}/statuses/${{ needs.resolve.outputs.sha }}" \
            -d '{"state":"pending","context":"e2e/vm/artix-dinit","description":"Running...","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout agent code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Download the pacman package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.pkg.tar.zst
