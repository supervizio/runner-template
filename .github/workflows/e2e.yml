      # cross-compiled one: upstream lld cannot produce a runnable OpenBSD
      # executable, so agent's bench VM rebuilds it natively and that rebuild is
      # what the .tgz carries -- what the release publishes, and what
      # install.sh's pkg_add installs.
      #
