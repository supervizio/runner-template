          mv "bin/supervizio-freebsd-arm64" bin/supervizio

      - name: Install, validate and uninstall in a freebsd guest
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          usesh: true
          # aarch64 guest on an x86_64 HOST. The action's own README is explicit:
          # "When you run with aarch64, the host runner should still be the
          # normal x86_64 runner... It's not recommended to use
          # ubuntu-24.04-arm as runner, it's much more slower." There is no
          # nested KVM on GitHub's arm64 fleet either way, so the guest is
          # TCG-emulated whichever host you pick -- measured at roughly 26x the
          # KVM path, which is why this leg budgets 180 minutes where its amd64
          # sibling needs 30.
          arch: aarch64
          # Pinned, for the same reason the Windows leg pins its image: an
          # unpinned guest floats with the action's default and moves coverage
          # with no diff. agent/e2e/expected-matrix.json expects "FreeBSD 15"; the bench builds 15.0-RELEASE.
          # The action's default here is 15.1.
          release: '15.0'
          copyback: false
          prepare: pkg install -y jq
          run: |
            set -e
            # TCG, not KVM: this guest has no physical CPU clock, so the probe
            # reports .cpu.frequency_mhz as null. The amd64 sibling runs under
            # KVM and reports one, which is why only the arm64 legs needed this.
            SVZ_EMULATED_CPU=1; export SVZ_EMULATED_CPU
            WS="$(pwd)"
            echo "=== Platform ==="; uname -a
            export SUPERVIZIO_LOCAL_BIN="$WS/bin/supervizio"
            chmod +x "$SUPERVIZIO_LOCAL_BIN"

            echo "=== Install ==="
            sh "$WS/setup/install.sh" || { echo "::error::install.sh failed"; exit 1; }

            echo "=== Verify install ==="
            [ -x /usr/local/bin/supervizio ] || { echo "binary not installed"; exit 1; }
            /usr/local/bin/supervizio --version

            echo "=== Validate probe ==="
            sh "$WS/e2e/validate-probe.sh" /usr/local/bin/supervizio \
              || { echo "::error::validate-probe.sh failed"; exit 1; }

            echo "=== Supervision scenarios ==="
            sh "$WS/e2e/scenario-battery.sh" /usr/local/bin/supervizio \
              || { echo "::error::scenario-battery.sh failed"; exit 1; }

            # Detection vs ground truth, ADVISORY. The freebsd-arm64 /
            # netbsd-arm64 entries in expected-matrix.json are seeded from their
            # amd64 siblings, not captured from a real arm64 guest, so a
            # mismatch means "correct the matrix" -- which is exactly what that
            # file tells you to do -- and not "fail the leg". The first real
            # capture is the authority; until then this reports without gating.
            #
            # probe-capabilities.sh, not raw `--probe`: the validator consumes
            # the capability shape the bench feeds it, and `--probe` already
            # emits JSON on its own (the `-f json` in validate-detection.sh's
            # own usage comment is stale).
            echo "=== Detection vs expected-matrix (advisory) ==="
            sh "$WS/e2e/probe-capabilities.sh" /usr/local/bin/supervizio \
               /tmp/probe-cap.json "freebsd-arm64" || true
            /usr/local/bin/supervizio --inventory all > /tmp/inventory.json 2>/dev/null || true
            if [ -s /tmp/probe-cap.json ] && [ -s /tmp/inventory.json ]; then
              sh "$WS/e2e/validate-detection.sh" "freebsd-arm64" \
                 /tmp/probe-cap.json /tmp/inventory.json --advisory \
                || echo "::warning::detection drifted from expected-matrix for freebsd-arm64 - correct e2e/expected-matrix.json"
            else
              echo "::warning::could not capture probe/inventory dumps on freebsd-arm64 - detection not checked"
            fi

            echo "=== Uninstall ==="
