          docker exec svz sh /tmp/validate-probe.sh

          echo "=== Supervision scenarios ==="
          docker exec svz sh /tmp/scenario-battery.sh /usr/local/bin/supervizio

          echo "=== Uninstall ==="
          docker exec -e SUPERVIZIO_NON_INTERACTIVE=true svz sh /tmp/setup/uninstall.sh

