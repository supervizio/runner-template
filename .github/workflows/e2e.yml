      # validated a THIRD binary, one that ships nowhere: the cross build is
      # broken, the guest rebuild was untested, and the bench build is what
      # users get. agent's native-platform.yml now bridges the native package,
      # so this consumes exactly what a user consumes, through the same path.
      - name: Download the native OpenBSD package from the agent run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
