          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false

      # The bench leg pulled this package from zot at 192.168.100.250, which a
      # hosted runner cannot reach. Same bytes, taken from the GitHub artifact
      # agent's packaging jobs now mirror. Downloaded on the HOST and synced in
      # by vmactions -- the token never enters the guest.
      - name: Download package from the agent run (cross-repo)
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: supervizio-amd64.rpm
          path: pkg
          repository: ${{ needs.resolve.outputs.source_repo }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.AGENT_REPO_TOKEN }}

      # nfpm emits VERSION-qualified, packager-native names
      # (supervizio_0.0.0_amd64.deb, supervizio-0.0.0-1.x86_64.rpm). Only
      # release.yml renames them to the canonical supervizio-<arch>.<ext>, and
      # that happens at RELEASE time -- a CI artifact carries the raw name. So
      # resolve by extension and normalise, rather than asserting a name the
      # artifact never had. This is the same drift pkg-asset-naming.bats exists
      # to pin, seen from the consuming end.
