name: Cleanup dispatched E2E

# Deletes each dispatched E2E run once it completes, so no persistent public
# trace of the private-source run remains. A run cannot delete itself while
# running, hence this separate workflow_run-triggered janitor.
#
# Covers BOTH dispatch surfaces. It was scoped to libprobe's workflow alone,
# which left agent's "E2E Tests" runs — checked out from a private repo, naming
# its SHAs and branches — accumulating in this public repo indefinitely. The
# asymmetry was not deliberate; libprobe simply got the janitor first.
#
# STRICTLY scoped: only runs triggered by repository_dispatch are deleted.
# A workflow_dispatch run is someone debugging on purpose and is left alone.
# This janitor's own run is tiny and contains no source or test output.

on:
  workflow_run:
    workflows: ["External E2E (dispatched)", "E2E Tests"]
    types: [completed]

permissions: {}

jobs:
  delete-run:
    name: Delete completed dispatched run
    if: ${{ github.event.workflow_run.event == 'repository_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # Delete-only janitor: it checks out nothing, so actions:write is the only
      # scope it needs (least privilege).
      actions: write
    steps:
      - name: Delete the run
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RID: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          echo "deleting ${NAME} run ${RID}"
          # Only 204 (deleted) and 404 (already gone, e.g. by
          # cleanup-product-runs.yml) are a clean result. Anything else fails
          # this job, so a run left public is a red run, not a silent one.
          code="$(curl -sS -o "$RUNNER_TEMP/delete.txt" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API/actions/runs/$RID")" || code="curl-error"
          case "$code" in
            204) echo "deleted." ;;
            404) echo "already gone." ;;
            *) echo "::error::could not delete ${NAME} run ${RID} (HTTP $code); cleanup-product-runs.yml retries it"; cat "$RUNNER_TEMP/delete.txt" || true; exit 1 ;;
          esac
